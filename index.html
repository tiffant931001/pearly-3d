<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:linear-gradient(180deg,#d4f4ff 0%,#dfe3ff 34%,#e6d2ff 66%,#eda8fe 100%);}
  canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font:13px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    color:#8a6a9e;opacity:.45;pointer-events:none;user-select:none}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/addons/"
}}
</script>
</head>
<body>
<div id="hint">v8 · 拖曳旋轉 · 點一下 · 點兩下揮手</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('still'), LIT = Q.has('lit');
const EXPR = Q.get('expr');            // smile | neutral | sad（測試用）
const FORCE_BLINK = Q.has('blink');
const SHOW_BLUSH = Q.has('blush');
const WAVEAT = Q.has('waveat') ? parseFloat(Q.get('waveat')) : null;
const WAMP = Q.has('wamp') ? parseFloat(Q.get('wamp')) : 0.46;
if (Q.has('key')) document.body.style.background = '#00ff00';

/* ── 場景 ───────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOV = Q.has('fov') ? parseFloat(Q.get('fov')) : 30;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 60);

// 光只加很淡的一層：主要明暗其實畫在頂點色裡（跟原圖一致）
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, Q.has('hemi') ? parseFloat(Q.get('hemi')) : 1.80));
const key = new THREE.DirectionalLight(0xffffff, Q.has('keyi') ? parseFloat(Q.get('keyi')) : 0.42); key.position.set(0.8, 2.2, 3.2);
const fill = new THREE.DirectionalLight(0xffeef8, 0.22); fill.position.set(-3, 0.6, 1.6);
// 左右側光：把耳朵/手臂外側提亮（原畫的柔和均勻感）
const SID = Q.has('sid') ? parseFloat(Q.get('sid')) : 1.00;
const sidL = new THREE.DirectionalLight(0xffffff, SID); sidL.position.set(-3.2, 0.4, 0.6);
const sidR = new THREE.DirectionalLight(0xffffff, SID); sidR.position.set( 3.2, 0.4, 0.6);
scene.add(key, fill, sidL, sidR);

const spin = new THREE.Group();       // 水平旋轉（360°）
const tiltOuter = new THREE.Group();  // 上下俯仰
tiltOuter.add(spin);
scene.add(tiltOuter);
const hop = new THREE.Group();        // 跳躍 / 擠壓
spin.add(hop);

/* ── 狀態 ───────────────────────────────── */
let loaded = false, baseScale = 1, modelH = 1, modelW = 1;
const parts = { ears: [], eyes: [], arms: [], mouth: null, head: null };
const blush = [];
const clock = new THREE.Clock();
let t = 0;
let yaw = 0, pitch = 0, yawV = 0, pitchV = 0;      // 拖曳
let dragging = false, lastX = 0, lastY = 0, lastMove = 0;
let expr = EXPR || 'smile';
let blinkT = -1, nextBlink = 3.0;
let blushAmt = 0, blushTarget = 0;
let squash = 0, squashV = 0, jumpY = 0, jumpV = 0;
const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;

/* ── 腮紅貼圖（照她手畫的樣式：橫向霧狀帶 + 眼下小黑橢圓）── */
function blushTexture(){
  const w = 256, h = 256, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  gr.addColorStop(0.00, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.32, 'rgba(255,255,255,0.80)');
  gr.addColorStop(0.62, 'rgba(255,255,255,0.35)');
  gr.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function ovalTexture(){
  const w = 256, h = 160, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.strokeStyle = '#232323'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath();
  // 手繪感：稍微歪、不完全閉合
  g.ellipse(w*0.5, h*0.5, w*0.36, h*0.30, -0.12, 0.15, Math.PI*1.92);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ── 載入模型 ───────────────────────────── */
new GLTFLoader().load('./model/character.glb', (gltf) => {
  const src = gltf.scene;
  src.updateMatrixWorld(true);
  const meshes = [];
  src.traverse(o => { if (o.isMesh) meshes.push(o); });

  const body = new THREE.Group();
  const tex = blushTexture();

  meshes.forEach(o => {
    let geo = o.geometry.clone();
    geo.applyMatrix4(o.matrixWorld);
    // 把重複頂點合併 → 法線才會平滑（原檔是逐面拆開的，否則會一片片硬邊）
    const vBefore = geo.attributes.position.count;
    try { geo = mergeVertices(geo, 1e-3); } catch (err) {}
    window.__vert = (window.__vert || '') + vBefore + '->' + geo.attributes.position.count + ' ';
    geo.computeBoundingBox();
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    const size = geo.boundingBox.getSize(new THREE.Vector3());
    geo.translate(-c.x, -c.y, -c.z);
    geo.computeVertexNormals();

    // 頂點色比原畫鮮豔很多 → 用 gamma 提亮／降對比，讓它接近原圖的奶感
    const GAM = Q.has('gam') ? parseFloat(Q.get('gam')) : 0.70;
    const ca = geo.attributes.color;
    if (ca && GAM !== 1) {
      for (let i = 0; i < ca.count; i++) {
        ca.setXYZ(i, Math.pow(ca.getX(i), GAM), Math.pow(ca.getY(i), GAM), Math.pow(ca.getZ(i), GAM));
      }
      ca.needsUpdate = true;
    }

    const DES = Q.has('des') ? parseFloat(Q.get('des')) : 0.26;
    if (ca && DES > 0) {
      for (let i = 0; i < ca.count; i++) {
        const r = ca.getX(i), g = ca.getY(i), b = ca.getZ(i);
        const l = 0.299*r + 0.587*g + 0.114*b;
        ca.setXYZ(i, r + (l-r)*DES, g + (l-g)*DES, b + (l-b)*DES);
      }
      ca.needsUpdate = true;
    }

    const mat = Q.has('basic')
      ? new THREE.MeshBasicMaterial({ vertexColors: true })
      : new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 1, metalness: 0,
          flatShading: !Q.has('smooth'), side: THREE.FrontSide,
          emissive: 0xffffff, emissiveIntensity: 0.03   // 極輕微提亮，避免死黑
        });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(c);
    mesh.userData.size = size;
    mesh.userData.center = c.clone();
    body.add(mesh);

    const ax = Math.abs(c.x);
    if (size.z < 0.12 && size.x < 0.25 && size.y > 0.15 && c.z > 0.35) parts.eyes.push(mesh);
    else if (size.y < 0.12 && size.x < 0.15 && c.z > 0.35) parts.mouth = mesh;
    else if (ax > 0.45 && size.y > 0.90) { mesh.material.color.setScalar(1.34); parts.arms.push(mesh); }
    else if (ax > 0.45 && size.y > 0.55 && size.y < 0.85) { mesh.material.color.setScalar(1.12); parts.ears.push(mesh); }
    else if (size.x > 0.9) { mesh.material.color.setScalar(0.97); parts.head = mesh; }
  });

  // 置中 + 縮放（高度 = 2）
  body.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(body);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  body.position.sub(center);
  baseScale = 2.0 / size.y;
  modelH = size.y; modelW = size.x;
  hop.scale.setScalar(baseScale);
  hop.add(body);

  /* 普通表情用的短橫線嘴巴（顏色沿用嘴巴本身的粉紅） */
  if (parts.mouth) {
    const mc = new THREE.Color(1,1,1);
    const cAttr = parts.mouth.geometry.attributes.color;
    if (cAttr) {
      let r=0,g=0,b=0;
      for (let i=0;i<cAttr.count;i++){ r+=cAttr.getX(i); g+=cAttr.getY(i); b+=cAttr.getZ(i); }
      const n = cAttr.count; mc.setRGB(r/n, g/n, b/n);
    }
    // 用「管子」做嘴巴（跟 ^ 一樣是真幾何，不會被臉切到）
    // 用「畫上去的圓角線條」做嘴巴：乾淨、不出現切面
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 180;
    const g2 = cv.getContext('2d');
    g2.strokeStyle = '#fff'; g2.lineWidth = 108; g2.lineCap = 'round';
    g2.beginPath();
    g2.moveTo(70, 78);
    g2.quadraticCurveTo(256, 108, 442, 78);   // 中間微微低、兩端微上揚
    g2.stroke();
    const ltex = new THREE.CanvasTexture(cv);
    ltex.colorSpace = THREE.SRGBColorSpace;
    ltex.anisotropy = 8;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.082, 0.029),
      new THREE.MeshBasicMaterial({ map: ltex, color: mc, transparent: true, depthWrite: false, toneMapped: false })
    );
    const p0 = parts.mouth.position;
    line.position.set(p0.x, p0.y + 0.002, p0.z + (Q.has('mz') ? parseFloat(Q.get('mz')) : 0.025));
    line.visible = false;
    parts.mouth.parent.add(line);
    parts.mouthLine = line;
  }

  /* 旋轉樞紐：手臂繞肩、耳朵繞根部 */
  function addPivot(mesh, px, py, innerSign){
    const g = new THREE.Group();
    g.position.set(px, py, mesh.position.z);
    const off = new THREE.Vector3(mesh.position.x - px, mesh.position.y - py, 0);
    mesh.position.copy(off);
    mesh.parent.remove(mesh);
    g.add(mesh); body.add(g);
    g.userData.innerSign = innerSign;
    return g;
  }
  parts.arms.forEach(a => {
    const c0 = a.userData.center, sz = a.userData.size;
    const inner = c0.x < 0 ? 1 : -1;
    const g = addPivot(a, c0.x + inner*sz.x*0.12, c0.y + sz.y*0.42, inner);
    if (c0.x < 0) parts.armWave = g;    // 畫面左邊那隻手
    else parts.armOther = g;
  });
  parts.ears.forEach(e => {
    const c0 = e.userData.center, sz = e.userData.size;
    const inner = c0.x < 0 ? 1 : -1;
    e.userData.pivot = addPivot(e, c0.x + inner*sz.x*0.22, c0.y - sz.y*0.34, inner);
  });

  /* 腮紅：貼在臉頰，朝外 */
  if (parts.head) {
    [[-1], [1]].forEach(([sx]) => {
      // 橫向霧狀腮紅帶
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(0.36, 0.36),
        new THREE.MeshBasicMaterial({
          map: tex, color: 0xff8ac4, transparent: true, depthWrite: false,
          opacity: 0, toneMapped: false, blending: THREE.NormalBlending
        })
      );
      m.position.set(sx * 0.265, -0.055, 0.443);
      m.rotation.y = sx * 0.28;
      parts.head.parent.add(m);
      blush.push(m);

    });
  }

  camera.position.set(0, 0.05, 6.2);
  fitCamera();
  if (Q.has('dbg')) { const m=parts.mouth; document.title = m ? `mr=${m.rotation.x.toFixed(2)},${m.rotation.y.toFixed(2)},${m.rotation.z.toFixed(2)} mp=${m.position.x.toFixed(3)},${m.position.y.toFixed(3)},${m.position.z.toFixed(3)} ms=${m.scale.x.toFixed(2)},${m.scale.y.toFixed(2)},${m.scale.z.toFixed(2)}` : 'no mouth'; }
  if (Q.has('yaw'))   { yaw = parseFloat(Q.get('yaw')); }
  if (Q.has('pitch')) { pitch = parseFloat(Q.get('pitch')); }
  if (Q.has('expr'))  { expr = Q.get('expr'); applyExpression(true); }
  loaded = true;
  lastTap = performance.now();
  window.__ready = true;
  if (Q.has('auto')) { setTimeout(() => tap(), 550); }
  if (Q.has('wave')) { setTimeout(() => { waveT = 0; }, 400); }
  if (Q.has('taps')) {
    const n = parseInt(Q.get('taps')) || 3;
    for (let i = 0; i < n; i++) setTimeout(() => tap(), 500 + i * 220);
  }
}, undefined, e => { window.__err = String(e); });

/* ── 表情 ───────────────────────────────── */
const EXPRS = ['smile', 'neutral', 'sad'];
function setEyeOpen(v){ parts.eyes.forEach(e => { e.scale.y = v; }); }
function applyExpression(instant){
  const m = parts.mouth;
  if (!m) return;
  const line = parts.mouthLine;
  m.rotation.z = 0; m.scale.set(1, 1, 1);
  if (line) line.visible = false;
  if (expr === 'smile')      { m.visible = true;  m.rotation.z = 0;       }
  if (expr === 'sad')        { m.visible = true;  m.rotation.z = Math.PI; }
  if (expr === 'neutral')    {
    m.visible = false;
    if (line) line.visible = true;
    else { m.visible = true; m.scale.set(1, 0.22, 1); }   // 沒有線模型時退回舊做法
  }
  blushTarget = 0;   // 靜止時不上腮紅，點了才冒
}

/* ── 互動 ───────────────────────────────── */
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; lastMove = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const K = 0.012;
  yaw   += dx * K;                       // 直接跟手
  pitch += dy * K * 0.55;
  yawV   = dx * K * 14;                  // 放開後的慣性
  pitchV = dy * K * 8;
  lastMove = performance.now();
  if (Math.abs(dx) + Math.abs(dy) > 2) el.dataset.dragged = '1';
});
el.addEventListener('pointerup', e => {
  dragging = false;
  el.releasePointerCapture?.(e.pointerId);
  if (el.dataset.dragged !== '1') tap();
  el.dataset.dragged = '0';
});

let tapCount = 0, lastTap = -1e9;
let waveT = -1, doubleAt = -1e9;
let earTwitch = [-1, -1], nextTwitch = [5, 7];
function tap(){
  // 1) 跳一下：只有站在地面時才給向上的速度（避免連點越跳越高）
  if (jumpY <= 0.001) {
    squash = -0.30;       // 只壓一下，0.2 秒內回正
    jumpV = 3.1;
  }
  // 2) 腮紅閃一下
  blushAmt = Math.max(blushAmt, 0.9);
  lastTap = performance.now();
  // 3) 點兩下 → 揮手
  const now = performance.now();
  if (now - doubleAt < 340) { waveT = 0; doubleAt = -1e9; lastTap = now; return; }
  doubleAt = now;
  lastTap = now;

  // 4) 換表情
  tapCount++;
  if (tapCount > 1) expr = EXPRS[(EXPRS.indexOf(expr) + 1) % EXPRS.length];
  applyExpression();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (loaded) fitCamera();
});

function fitCamera(){
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const halfW = modelW * baseScale / 2;     // 角色實際橫向半寬（含耳朵）
  const dH = (modelH*baseScale/2 * 1.02) / tan;
  const dW = (halfW * 1.06) / (tan * camera.aspect);
  camera.position.z = Math.max(dH, dW) * (1 + 0.075 * (window.__waveZoom || 0));
  camera.lookAt(0, 0, 0);
}

/* ── 主迴圈 ─────────────────────────────── */
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!FREEZE) t += dt;

  if (loaded) {
    // 拖曳慣性 + 靜止 2.5 秒後慢慢轉回正面
    if (!dragging) {
      yaw   += yawV * dt;
      pitch += pitchV * dt;
      yawV *= 0.90; pitchV *= 0.90;
      const idle = performance.now() - lastMove;
      if (!FREEZE && idle > 900 && Math.abs(yawV) < 0.35 && Math.abs(pitchV) < 0.35) {
        const twoPi = Math.PI * 2;
        const nearest = Math.round(yaw / twoPi) * twoPi;   // 最短角度回正面
        yaw   += (nearest - yaw) * Math.min(1, dt * 3.0);
        pitch += (0 - pitch)      * Math.min(1, dt * 3.6);
      }
    }
    const ar = renderer.domElement.clientWidth / renderer.domElement.clientHeight;
    if (Math.abs(ar - camera.aspect) > 1e-3) {
      camera.aspect = ar; camera.updateProjectionMatrix(); fitCamera();
    }
    pitch = THREE.MathUtils.clamp(pitch, -0.55, 0.55);
    spin.rotation.y = yaw;
    tiltOuter.rotation.x = pitch;

    // 靜止基準
    hop.scale.set(baseScale, baseScale, baseScale);


    // 揮手（點兩下觸發）：平滑進出 + 手臂前傾 + 身體側傾
    if (waveT >= 0 || WAVEAT !== null) {
      waveT = (WAVEAT !== null) ? WAVEAT : waveT + dt;
      const DUR = 1.9;
      const p = Math.min(waveT / DUR, 1);
      const ss = x => x * x * (3 - 2 * x);
      const env2 = ss(Math.min(p / 0.2, 1)) * ss(Math.min((1 - p) / 0.2, 1));
      const ang = (-WAMP + Math.sin(waveT * 15) * 0.13) * env2;
      if (parts.armWave) {
        parts.armWave.rotation.z = ang;
        parts.armWave.rotation.x = -0.30 * env2;
      }
      hop.rotation.z = 0.030 * env2;     // 身體往揮手那側輕輕傾
      window.__waveZoom = env2; if (typeof fitCamera === 'function') fitCamera();
      if (waveT > DUR) {
        waveT = -1;
        if (parts.armWave) { parts.armWave.rotation.z = 0; parts.armWave.rotation.x = 0; }
        hop.rotation.z = 0;
        window.__waveZoom = 0; fitCamera();
      }
    }

    // 耳朵偶爾抖一下（待機 C）
    if (!FREEZE) {
      parts.ears.forEach((e, i) => {
        const g = e.userData.pivot;
        if (!g) return;
        if (earTwitch[i] < 0) {
          nextTwitch[i] -= dt;
          if (nextTwitch[i] <= 0) { earTwitch[i] = 0; nextTwitch[i] = 4 + Math.random() * 4; }
        } else {
          earTwitch[i] += dt;
          const k = earTwitch[i] / 0.50;
          g.rotation.z = Math.sin(earTwitch[i] * 26) * 0.115 * (1 - k) * g.userData.innerSign;
          if (k >= 1) { earTwitch[i] = -1; g.rotation.z = 0; }
        }
      });
    }

    // 跳躍（重力）
    if (!FREEZE || jumpY !== 0) {
      jumpV -= 10.0 * dt;
      jumpY += jumpV * dt;
      if (jumpY < 0) { jumpY = 0; jumpV = 0; squash = 0.22; }   // 落地壓一下
      hop.position.y = jumpY;
    }

    // 擠壓：改成「固定時間衰減」，不會累積、也不會卡住
    squash *= Math.exp(-13.0 * dt);
    if (Math.abs(squash) < 0.004) squash = 0;
    hop.scale.x *= 1 + squash * 0.16;   // squash 為負 → 變窄
    hop.scale.y *= 1 - squash * 0.12;   // 同時變高（總變形 < 5%）
    if (Q.has('dbg')) document.title = `mr=${parts.mouth.rotation.z.toFixed(3)} ms=${parts.mouth.scale.x.toFixed(2)},${parts.mouth.scale.y.toFixed(2)} mp=${parts.mouth.position.x.toFixed(3)},${parts.mouth.position.y.toFixed(3)},${parts.mouth.position.z.toFixed(3)}`;

    // 眨眼
    if (FREEZE) {
      if (FORCE_BLINK) setEyeOpen(0.06);
    } else {
      nextBlink -= dt;
      if (nextBlink <= 0 && blinkT < 0) { blinkT = 0; nextBlink = 2.8 + Math.random()*3.4; }
      if (blinkT >= 0) {
        blinkT += dt;
        const d = 0.13;
        const k = blinkT < d/2 ? blinkT/(d/2) : Math.max(0, 1 - (blinkT - d/2)/(d/2));
        setEyeOpen(1 - 0.94 * easeInOut(k));
        if (blinkT > d) { blinkT = -1; setEyeOpen(1); }
      }
    }

    // 4 秒沒互動 → 表情自動回到笑臉
    if (!FREEZE && expr !== 'smile' && performance.now() - lastTap > 4000) { expr = 'smile'; applyExpression(); }

    // 腮紅：點擊閃一下，再慢慢退
    if (SHOW_BLUSH) blushAmt = 0.85;
    blushAmt += (blushTarget - blushAmt) * Math.min(1, dt*1.6);
    blush.forEach(b => { b.material.opacity = Math.max(0, blushAmt) * 0.85; });
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);
</script>
</body>
</html>
