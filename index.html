<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;
    background:linear-gradient(180deg,#d4f4ff 0%,#dfe3ff 34%,#e6d2ff 66%,#eda8fe 100%);}
  canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font:13px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    color:#8a6a9e;opacity:.45;pointer-events:none;user-select:none}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/addons/"
}}
</script>
</head>
<body>
<div id="hint">v33 · 打盹 · 想睡 · 小動作</div>
<script>window.onerror=(m,src,l,c)=>{document.title='ERR '+m+' @'+l+':'+c;};</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('still'), LIT = Q.has('lit');
const EXPR = Q.get('expr');            // smile | neutral | sad（測試用）
const FORCE_BLINK = Q.has('blink');
const SHOW_BLUSH = Q.has('blush');
const WAVEAT = Q.has('waveat') ? parseFloat(Q.get('waveat')) : null;
const TFORCE = Q.has('ft') ? parseFloat(Q.get('ft')) : null;
const SWINGAT = Q.has('swingat') ? parseFloat(Q.get('swingat')) : null;
const WAMP = Q.has('wamp') ? parseFloat(Q.get('wamp')) : 0.95;
if (Q.has('key')) document.body.style.background = '#00ff00';

/* ── 場景 ───────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOV = Q.has('fov') ? parseFloat(Q.get('fov')) : 30;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 60);
window.__cam = camera;

// 光只加很淡的一層：主要明暗其實畫在頂點色裡（跟原圖一致）
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, Q.has('hemi') ? parseFloat(Q.get('hemi')) : 1.80));
const key = new THREE.DirectionalLight(0xffffff, Q.has('keyi') ? parseFloat(Q.get('keyi')) : 0.42); key.position.set(0.8, 2.2, 3.2);
const fill = new THREE.DirectionalLight(0xffeef8, 0.22); fill.position.set(-3, 0.6, 1.6);
// 左右側光：把耳朵/手臂外側提亮（原畫的柔和均勻感）
const SID = Q.has('sid') ? parseFloat(Q.get('sid')) : 1.00;
const sidL = new THREE.DirectionalLight(0xffffff, SID); sidL.position.set(-3.2, 0.4, 0.6);
const sidR = new THREE.DirectionalLight(0xffffff, SID); sidR.position.set( 3.2, 0.4, 0.6);
scene.add(key, fill, sidL, sidR);

const spin = new THREE.Group();       // 水平旋轉（360°）
const tiltOuter = new THREE.Group();  // 上下俯仰
tiltOuter.add(spin);
scene.add(tiltOuter);
const hop = new THREE.Group();        // 跳躍 / 擠壓
spin.add(hop);

/* ── 狀態 ───────────────────────────────── */
let loaded = false, baseScale = 1, modelH = 1, modelW = 1;
const parts = window.__parts = { ears: [], eyes: [], arms: [], mouth: null, head: null };
const blush = [];
const clock = new THREE.Clock();
let t = 0;
let yaw = 0, pitch = 0, yawV = 0, pitchV = 0;      // 拖曳
let dragging = false, lastX = 0, lastY = 0, lastMove = 0;
let expr = EXPR || 'smile';
/* ── 模式與待機狀態 ── */
let MODE = 'idle';           // idle | sleep | night | overspend
let idleT = 0, yawnT = -1, wakeT = -1;
let jumpPhase = 'idle', crouchT = 0, hairLagT = -1, hairLagAmp = 0.06;
let fidgetT = -1, fidgetCd = 14, fidgetKind = 'tilt';
let blinkT = -1, nextBlink = 3.0;
let blushAmt = 0, blushTarget = 0;
let squash = 0, squashV = 0, jumpY = 0, jumpV = 0;
const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;

/* ── 腮紅貼圖（照她手畫的樣式：橫向霧狀帶 + 眼下小黑橢圓）── */
function blushTexture(){
  const w = 256, h = 256, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  gr.addColorStop(0.00, 'rgba(255,255,255,1)');
  gr.addColorStop(0.30, 'rgba(255,255,255,0.88)');
  gr.addColorStop(0.55, 'rgba(255,255,255,0.45)');
  gr.addColorStop(0.78, 'rgba(255,255,255,0.12)');
  gr.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function ovalTexture(){
  const w = 256, h = 160, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.strokeStyle = '#232323'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath();
  // 手繪感：稍微歪、不完全閉合
  g.ellipse(w*0.5, h*0.5, w*0.36, h*0.30, -0.12, 0.15, Math.PI*1.92);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ── 載入模型 ───────────────────────────── */
new GLTFLoader().load('./model/character.glb', (gltf) => {
  const src = gltf.scene;
  src.updateMatrixWorld(true);
  const meshes = [];
  src.traverse(o => { if (o.isMesh) meshes.push(o); });

  const body = new THREE.Group();
  const tex = blushTexture();

  meshes.forEach(o => {
    let geo = o.geometry.clone();
    geo.applyMatrix4(o.matrixWorld);
    // 把重複頂點合併 → 法線才會平滑（原檔是逐面拆開的，否則會一片片硬邊）
    const vBefore = geo.attributes.position.count;
    try { geo = mergeVertices(geo, 1e-3); } catch (err) {}
    window.__vert = (window.__vert || '') + vBefore + '->' + geo.attributes.position.count + ' ';
    geo.computeBoundingBox();
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    const size = geo.boundingBox.getSize(new THREE.Vector3());
    geo.translate(-c.x, -c.y, -c.z);
    geo.computeVertexNormals();

    // 頂點色比原畫鮮豔很多 → 用 gamma 提亮／降對比，讓它接近原圖的奶感
    const GAM = Q.has('gam') ? parseFloat(Q.get('gam')) : 0.70;
    const ca = geo.attributes.color;
    if (ca && GAM !== 1) {
      for (let i = 0; i < ca.count; i++) {
        ca.setXYZ(i, Math.pow(ca.getX(i), GAM), Math.pow(ca.getY(i), GAM), Math.pow(ca.getZ(i), GAM));
      }
      ca.needsUpdate = true;
    }

    const DES = Q.has('des') ? parseFloat(Q.get('des')) : 0.26;
    if (ca && DES > 0) {
      for (let i = 0; i < ca.count; i++) {
        const r = ca.getX(i), g = ca.getY(i), b = ca.getZ(i);
        const l = 0.299*r + 0.587*g + 0.114*b;
        ca.setXYZ(i, r + (l-r)*DES, g + (l-g)*DES, b + (l-b)*DES);
      }
      ca.needsUpdate = true;
    }

    const mat = Q.has('basic')
      ? new THREE.MeshBasicMaterial({ vertexColors: true })
      : new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 1, metalness: 0,
          flatShading: !Q.has('smooth'), side: THREE.FrontSide,
          emissive: 0xffffff, emissiveIntensity: 0.03   // 極輕微提亮，避免死黑
        });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(c);
    mesh.userData.size = size;
    mesh.userData.center = c.clone();
    body.add(mesh);

    const ax = Math.abs(c.x);
    if (size.z < 0.12 && size.x < 0.25 && size.y > 0.15 && c.z > 0.35) parts.eyes.push(mesh);
    else if (size.y < 0.12 && size.x < 0.15 && c.z > 0.35) parts.mouth = mesh;
    else if (ax > 0.45 && size.y > 0.90) { mesh.material.color.setScalar(1.34); parts.arms.push(mesh); }
    else if (ax > 0.45 && size.y > 0.55 && size.y < 0.85) { mesh.material.color.setScalar(1.12); parts.ears.push(mesh); }
    else if (size.x > 0.9) { mesh.material.color.setScalar(0.97); parts.head = mesh; }
  });

  // 置中 + 縮放（高度 = 2）
  body.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(body);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  body.position.sub(center);
  baseScale = 2.0 / size.y;
  window.__bodyBaseY = body.position.y;
  modelH = size.y; modelW = size.x;
  hop.scale.setScalar(baseScale);
  hop.add(body);
  window.__body = body;
  window.__hop = hop;
  window.__THREE = THREE;
  window.__YB = new THREE.Box3().setFromObject(body).min.y / baseScale;   // 腳底（body 座標）

  /* 普通表情用的短橫線嘴巴（顏色沿用嘴巴本身的粉紅） */
  if (parts.mouth) {
    const mc = new THREE.Color(1,1,1);
    const cAttr = parts.mouth.geometry.attributes.color;
    if (cAttr) {
      let r=0,g=0,b=0;
      for (let i=0;i<cAttr.count;i++){ r+=cAttr.getX(i); g+=cAttr.getY(i); b+=cAttr.getZ(i); }
      const n = cAttr.count; mc.setRGB(r/n, g/n, b/n);
    }
    // 用「管子」做嘴巴（跟 ^ 一樣是真幾何，不會被臉切到）
    // 用「畫上去的圓角線條」做嘴巴：乾淨、不出現切面
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 180;
    const g2 = cv.getContext('2d');
    g2.strokeStyle = '#fff'; g2.lineWidth = 108; g2.lineCap = 'round';
    g2.beginPath();
    g2.moveTo(70, 78);
    g2.quadraticCurveTo(256, 108, 442, 78);   // 中間微微低、兩端微上揚
    g2.stroke();
    const ltex = new THREE.CanvasTexture(cv);
    ltex.colorSpace = THREE.SRGBColorSpace;
    ltex.anisotropy = 8;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.082, 0.029),
      new THREE.MeshBasicMaterial({ map: ltex, color: mc, transparent: true, depthWrite: false, toneMapped: false })
    );
    const p0 = parts.mouth.position;
    line.position.set(p0.x, p0.y + 0.002, p0.z + (Q.has('mz') ? parseFloat(Q.get('mz')) : 0.025));
    line.visible = false;
    parts.mouth.parent.add(line);
    parts.mouthLine = line;
  }

  /* 旋轉樞紐：手臂繞肩、耳朵繞根部 */
  function addPivot(mesh, px, py, innerSign){
    const g = new THREE.Group();
    g.position.set(px, py, mesh.position.z);
    const off = new THREE.Vector3(mesh.position.x - px, mesh.position.y - py, 0);
    mesh.position.copy(off);
    mesh.parent.remove(mesh);
    g.add(mesh); body.add(g);
    g.userData.innerSign = innerSign;
    return g;
  }
  // 用「世界座標」重新認零件：頭髮＝兩大顆、手＝兩顆小錐形、裙子＝中間那片
  if (parts.eyes.length) {
    const e0 = new THREE.Box3().setFromObject(parts.eyes[0]).getCenter(new THREE.Vector3());
    parts.eyeCenterX = Math.abs(e0.x); parts.eyeCenterY = e0.y;
  }
  body.updateMatrixWorld(true);
  parts.hair = []; parts.hands = []; parts.skirt = null;
  body.children.filter(o => o.isMesh).forEach(o => {
    const bb = new THREE.Box3().setFromObject(o);
    const sz = bb.getSize(new THREE.Vector3());
    const c0 = bb.getCenter(new THREE.Vector3());
    if (o !== parts.head && sz.x > 0.50 && sz.y > 0.60 && c0.y > 0.05 && o.geometry.attributes.position.count < 150) {
      parts.hair.push(o);
      const inner = c0.x < 0 ? 1 : -1;
      o.userData.pivot = addPivot(o, c0.x + inner*sz.x*0.28, c0.y - sz.y*0.28, inner);
    } else if (Math.abs(c0.x) > 0.18 && Math.abs(c0.x) < 0.36 && c0.y < -0.28 && sz.x < 0.45) {
      parts.hands.push(o);
      o.userData.innerSign = c0.x < 0 ? 1 : -1;
      o.userData.center = c0.clone();
    } else if (Math.abs(c0.x) < 0.06 && sz.x > 0.35 && sz.x < 0.58 && sz.y < 0.36) {
      parts.skirtTopLocal = c0.y + sz.y * 0.5;   // body 座標（不帶世界位移）
      parts.skirt = addPivot(o, c0.x, c0.y + sz.y*0.48, 1);
    }
    if (sz.x > 0.90 && Math.abs(c0.x) < 0.10) { parts.head = o; parts.headCenter = c0.clone(); parts.headRadius = sz.x * 0.5; parts.headDepth = sz.z * 0.5; }
  });

  // 手：固定點放在裙子上緣（不是在臉旁邊），轉動時就像從身體長出來
  const handPivotY = (parts.skirtTopLocal !== undefined ? parts.skirtTopLocal - 0.015 : -0.40);
  parts.hands.forEach(o => {
    const c0 = o.userData.center, inner = o.userData.innerSign;
    const g = addPivot(o, c0.x + inner * 0.02, handPivotY, inner);
    o.userData.pivot = g;
    if (c0.x < 0) parts.handWave = g; else parts.handOther = g;
  });


  /* 頭部旋轉：側傾(aZ) + 前後點頭(aX)，眼睛嘴巴腮紅全部跟著同一個脖子點 */
  window.__headRotate = function (aZ, aX) {
    if (!parts.head) return;
    aZ = aZ || 0; aX = aX || 0;
    const list = [parts.head, ...(parts.eyes || []), parts.mouth, parts.mouthLine, ...(parts.blushList || [])].filter(Boolean);
    const neckY = (parts.headCenter ? parts.headCenter.y : 0) - (parts.headRadius || 0.49) * 0.72;
    const neckZ = parts.headCenter ? parts.headCenter.z : 0;
    const c1 = Math.cos(aZ), s1 = Math.sin(aZ);
    const c2 = Math.cos(aX), s2 = Math.sin(aX);
    list.forEach(m => {
      if (m.userData._bx === undefined) {
        m.userData._bx = m.position.x; m.userData._by = m.position.y; m.userData._bz = m.position.z;
        m.userData._br = m.rotation.z; m.userData._rx = m.rotation.x;
      }
      const x = m.userData._bx;
      const y = m.userData._by - neckY;
      const z = m.userData._bz - neckZ;
      const x1 = x * c1 - y * s1;          // 側傾（繞 Z）
      const y1 = x * s1 + y * c1;
      const y2 = y1 * c2 - z * s2;         // 點頭（繞 X）
      const z2 = y1 * s2 + z * c2;
      m.position.set(x1, neckY + y2, neckZ + z2);
      if (m !== parts.mouth && m !== parts.mouthLine) {
        m.rotation.z = m.userData._br + aZ;
        m.rotation.x = m.userData._rx + aX;
      }
    });
  };

  /* 腮紅：貼在臉頰，朝外 */
  body.updateWorldMatrix(true, true);   // 射線要打在正確的世界座標上
  if (parts.head) {
    const hc = parts.headCenter || new THREE.Vector3(0, 0, 0);
    [[-1], [1]].forEach(([sx]) => {
      // 橫向霧狀腮紅帶
      const m = new THREE.Mesh(
        new THREE.CircleGeometry(0.115, 28),
        new THREE.MeshBasicMaterial({
          map: tex, color: 0xff8ac4, transparent: true, depthWrite: false,
          opacity: 0, toneMapped: false, blending: THREE.NormalBlending
        })
      );
      // 貼在「頭的球面」上：眼球比臉凸，所以眼睛會自己擋住腮紅（不是靠縮小）
      let px = sx * 0.28, py = -0.05, pz = 0.55;
      if (parts.eyes && parts.eyes[0] && parts.head) {
        const hb = new THREE.Box3().setFromObject(parts.head);
        const hc = hb.getCenter(new THREE.Vector3());
        const R = (hb.max.x - hb.min.x) / 2;
        const ewp = new THREE.Vector3();
        parts.eyes[0].getWorldPosition(ewp);
        const wx = sx * Math.abs(ewp.x) * 1.06;
        const wy = ewp.y - 0.145;                     // 世界座標：眼睛下方
        // 用射線打真正的臉（低多邊形不是正球，用球面近似會有一邊埋進臉裡）
        const rc = new THREE.Raycaster(new THREE.Vector3(wx, wy, hc.z + 2.0), new THREE.Vector3(0, 0, -1));
        const hits = rc.intersectObject(parts.head, true);
        if (hits.length) {
          const hp = hits[0].point.clone();
          const nn = hits[0].face ? hits[0].face.normal.clone().transformDirection(parts.head.matrixWorld).normalize() : new THREE.Vector3(0, 0, 1);
          const wp = hp.clone().add(nn.clone().multiplyScalar(0.012));
          const lp = body.worldToLocal(wp.clone());
          const lp2 = body.worldToLocal(hp.clone().add(nn.clone().multiplyScalar(0.10)));
          px = lp.x; py = lp.y; pz = lp.z;
          m.userData.fn = lp2.sub(lp).normalize();     // 臉的法線（body 座標）
        } else {
          const lp = body.worldToLocal(new THREE.Vector3(wx, wy, hc.z + R + 0.03));
          px = lp.x; py = lp.y; pz = lp.z;
        }
      }
      m.position.set(px, py, pz);
      if (m.userData.fn) m.lookAt(px + m.userData.fn.x, py + m.userData.fn.y, pz + m.userData.fn.z);
      else m.rotation.y = sx * 0.26;
      body.add(m);
      (parts.blushList = parts.blushList || []).push(m);
      m.renderOrder = -1;   // 畫在眼睛後面
      blush.push(m);

    });
  }

  camera.position.set(0, 0.05, 6.2);
  fitCamera();
  if (Q.has('list')) { const out=[]; body.traverse(o=>{ if(o.isMesh && o.geometry){ const bb=new THREE.Box3().setFromObject(o); const sz=new THREE.Vector3(); bb.getSize(sz); const c=new THREE.Vector3(); bb.getCenter(c); out.push([o.name, +c.x.toFixed(2), +c.y.toFixed(2), +c.z.toFixed(2), +sz.x.toFixed(2), +sz.y.toFixed(2), +sz.z.toFixed(2), o.geometry.attributes.position.count]); } }); document.title = 'LIST'+JSON.stringify(out); }
  if (Q.has('bl')) { const info=[]; blush.forEach(b=>{ b.updateWorldMatrix(true,false); const w=new THREE.Vector3(); b.getWorldPosition(w); info.push({local:[+b.position.x.toFixed(2),+b.position.y.toFixed(2),+b.position.z.toFixed(2)], world:[+w.x.toFixed(2),+w.y.toFixed(2),+w.z.toFixed(2)], parent: b.parent.type + ':' + [b.parent.position.x.toFixed(2),b.parent.position.y.toFixed(2)].join(',')}); }); document.title='BL'+JSON.stringify(info); }
  if (Q.has('hh')) { parts.hands.forEach(h=>h.visible=false); }
  if (Q.has('hhi')) { parts.hands.forEach(h=>{ h.material.color.set(0xff0000); }); }
  if (Q.has('hw')) { const g=parts.handWave; const b=parts.handWave&&parts.handWave.children[0]; const w=new THREE.Vector3(); if(g) g.getWorldPosition(w); document.title='HW'+JSON.stringify({has:!!g, gpos:g?[+g.position.x.toFixed(2),+g.position.y.toFixed(2),+g.position.z.toFixed(2)]:null, world:[+w.x.toFixed(2),+w.y.toFixed(2),+w.z.toFixed(2)], hands:parts.hands.length, vis: b?b.visible:null}); }
  if (Q.has('dbg')) { const m=parts.mouth; document.title = m ? `mr=${m.rotation.x.toFixed(2)},${m.rotation.y.toFixed(2)},${m.rotation.z.toFixed(2)} mp=${m.position.x.toFixed(3)},${m.position.y.toFixed(3)},${m.position.z.toFixed(3)} ms=${m.scale.x.toFixed(2)},${m.scale.y.toFixed(2)},${m.scale.z.toFixed(2)}` : 'no mouth'; }
  if (Q.has('yaw'))   { yaw = parseFloat(Q.get('yaw')); }
  if (Q.has('pitch')) { pitch = parseFloat(Q.get('pitch')); }
  if (Q.has('expr'))  { expr = Q.get('expr'); applyExpression(true); }
  loaded = true;
  applyExpression(true);
  lastTap = performance.now();
  window.__ready = true;
  if (Q.has('auto')) { setTimeout(() => tap(), 550); }
  if (Q.has('wave')) { setTimeout(() => { waveT = 0; expr = 'smile'; applyExpression(true); }, 400); }
  if (Q.has('taps')) {
    const n = parseInt(Q.get('taps')) || 3;
    for (let i = 0; i < n; i++) setTimeout(() => tap(), 500 + i * 220);
  }
}, undefined, e => { window.__err = String(e); });

/* ── 表情 ───────────────────────────────── */
const EXPRS = ['smile', 'neutral', 'sad'];
window.__jumpY = () => jumpY;
window.__exprGet = () => ({ expr, waveT, tapTimes: tapTimes.length, pending: pendingWave !== null });
function setEyeOpen(v){ parts.eyes.forEach(e => { e.scale.y = v; }); }
function applyExpression(instant){
  const m = parts.mouth;
  if (!m) return;
  const line = parts.mouthLine;
  m.rotation.z = 0; m.scale.set(1, 1, 1);
  if (line) line.visible = false;
  if (expr === 'smile')      { m.visible = true;  m.rotation.z = Math.PI; }   // ∨ = 開心

/* ── 小被子（抓著一個角） ─────────────────── */
let blanket = null;
function buildBlanket() {
  if (blanket || !parts.handOther || !window.__body) return;

  c.fillStyle = 'rgba(255,255,255,0.95)';

  parts.handOther.getWorldPosition(wp);

/* ── ZZZ（睡覺時 2D 圖層） ───────────────── */

/* ── 杯子道具（可拖曳） ─────────────────── */
let cup = null, cupDrag = false, cupPos = new THREE.Vector3(0.95, -0.98, 0.55);

  bottom.rotation.x = -Math.PI / 2; bottom.position.y = -0.12;
  const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.15, 18), inner);
  coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.09;
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.022, 8, 14, Math.PI * 1.4), mat);

const ray = new THREE.Raycaster();
function cupHit(cx, cy) {
  if (!cup) return false;
  const v = new THREE.Vector3();
  cup.getWorldPosition(v);

  const sy = (-v.y * 0.5 + 0.5) * innerHeight;
  return Math.hypot(cx - sx, cy - sy) < 70;      // 螢幕 70px 內就算抓到杯子

/* ── 互動 ───────────────────────────────── */
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {

    cupDrag = true; el.setPointerCapture(e.pointerId);
    el.dataset.dragged = '1';
    return;
  }

    const bub = hitBubble(e.clientX, e.clientY);
    if (bub) { popBubble(bub); return; }        // 點破泡泡 → 嚇醒
  }

  el.setPointerCapture(e.pointerId);

el.addEventListener('pointermove', e => {

    const wp = new THREE.Vector3(v.x, v.y, 0.5).unproject(camera);
    const dir = wp.sub(camera.position).normalize();
    const t = (0.55 - camera.position.z) / dir.z;
    cup.position.copy(camera.position).add(dir.multiplyScalar(t));
    cup.position.z = 0.55;
    cupPos.copy(cup.position);
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const K = 0.012;
  idleT = 0; lastTap = performance.now();
  yaw   += dx * K;                       // 直接跟手
  pitch += dy * K * 0.55;
  yawV   = dx * K * 14;                  // 放開後的慣性
  pitchV = dy * K * 8;

el.addEventListener('pointerup', e => {

let tapCount = 0, lastTap = -1e9;

let earTwitch = [-1, -1], nextTwitch = [5, 7];
function tap(){
  idleT = 0;

  // 腮紅立刻回饋（不等判定）
  blushAmt = Math.max(blushAmt, 0.9);
  const now = performance.now();
  tapTimes = tapTimes.filter(x => now - x < 700);
  tapTimes.push(now);
  const n = tapTimes.length;

  if (n === 1) {
    // 點一下 → 等 230ms 確認不是連點才跳（連點時整隻不動，頭才不會晃）

let _rzTimer = null;
addEventListener('resize', () => {
  clearTimeout(_rzTimer);
  _rzTimer = setTimeout(() => {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

  }, 120);
});

function fitCamera(){
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const halfW = modelW * baseScale / 2;     // 角色實際橫向半寬（含耳朵）
  const dH = (modelH*baseScale/2 * 1.02) / tan;
  const dW = (halfW * 1.06) / (tan * camera.aspect);
  camera.position.z = Math.max(dH, dW) * (1 + 0.075 * (window.__waveZoom || 0));

}

/* ── 主迴圈 ─────────────────────────────── */
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);

  if (loaded) {
    // 拖曳慣性 + 靜止 2.5 秒後慢慢轉回正面
    if (!dragging) {
      yaw   += yawV * dt;
      pitch += pitchV * dt;
      yawV *= 0.90; pitchV *= 0.90;
      const idle = performance.now() - lastMove;
      if (!FREEZE && idle > 900 && Math.abs(yawV) < 0.35 && Math.abs(pitchV) < 0.35) {
        const twoPi = Math.PI * 2;
        const nearest = Math.round(yaw / twoPi) * twoPi;   // 最短角度回正面
        yaw   += (nearest - yaw) * Math.min(1, dt * 3.0);
        pitch += (0 - pitch)      * Math.min(1, dt * 3.6);
      }
    }
    const ar = renderer.domElement.clientWidth / renderer.domElement.clientHeight;
    if (Math.abs(ar - camera.aspect) > 0.02) {     // 只有明顯變化才重算，避免每幀抖動
      camera.aspect = ar; camera.updateProjectionMatrix();

      fitCamera();
    }
    pitch = THREE.MathUtils.clamp(pitch, -0.55, 0.55);

    tiltOuter.rotation.x = pitch;

    // 靜止基準
    hop.scale.set(baseScale, baseScale, baseScale);


    // 22:00 之後（或 06:00 前）自動進入晚上模式
    if (loaded && !window.__autoNight) {
      window.__autoNight = true;

      if (hh >= 22 || hh < 6) setMode('night');
    }

      const g = parts.handWave;
      if (g) {

      if (waveT > DUR) {
        waveT = -1;
        if (g) { g.position.x = g.userData.baseX; g.position.y = g.userData.baseY; g.position.z = g.userData.baseZ; g.rotation.set(0,0,0); g.scale.setScalar(1); }
        hop.rotation.z = 0;
        window.__waveZoom = 0; fitCamera();
      }
    }


    // 跳躍：蹲下預備(0.09s) → 起飛 → 重力 → 落地
    if (!FREEZE) {
      if (jumpPhase === 'crouch') {
        crouchT += dt;
        const kk = Math.min(crouchT / 0.09, 1);
        const k = 1 - Math.pow(1 - kk, 2.2);          // ease-out：先快後慢（蓄力）
        squash = 0.13 * k; squashV = 0;                 // 蹲：壓扁
        if (kk >= 1) { jumpPhase = 'air'; jumpV = 3.2; squash = -0.07; squashV = 0; hairLagT = 0; hairLagAmp = 0.055; }  // 起飛：拉長
      } else if (jumpPhase === 'air') {
        jumpV -= 11.0 * dt;
        jumpY += jumpV * dt;
        if (jumpY <= 0) { jumpY = 0; jumpV = 0; hop.position.y = 0; jumpPhase = 'idle'; squash = 0.20; squashV = 0; hairLagT = 0; hairLagAmp = 0.085; }
        else hop.position.y = jumpY;   // 落地：壓縮後由彈簧回彈
      }
    }

    // 擠壓彈簧（會回彈、不會卡住）
    squashV += (-300 * squash - 17 * squashV) * dt;
    squash += squashV * dt;
    squash = THREE.MathUtils.clamp(squash, -0.20, 0.22);
    hop.scale.x *= 1 + squash * 0.30;
    hop.scale.y *= 1 - squash * 0.34;
    // 腳底釘住：擠壓時把整隻往上/下補償，腳不會離地或穿地
    if (window.__YB !== undefined) hop.position.y = jumpY + window.__YB * (baseScale - hop.scale.y) + (window.__lift || 0);
    if (Q.has('jit')) {
      const by = (window.__body ? window.__body.position.y : 0);
      window.__jb = window.__jb || {prev: by, max: 0, sum: 0, n: 0, prevT: t};
      const d = Math.abs(by - window.__jb.prev);
      window.__jb.max = Math.max(window.__jb.max, d);
      window.__jb.sum += d; window.__jb.n++;
      window.__jb.prev = by;
      document.title = `jit max=${window.__jb.max.toFixed(4)} avg=${(window.__jb.sum/window.__jb.n).toFixed(5)} dt=${dt.toFixed(3)} n=${window.__jb.n}`;
    }
    if (Q.has('dbg')) document.title = `hw=${parts.handWave?parts.handWave.rotation.z.toFixed(2):'none'} hy=${parts.handWave?parts.handWave.position.y.toFixed(2):'-'} wt=${waveT.toFixed(2)} wa=${WAVEAT} mr=${parts.mouth.rotation.z.toFixed(3)} ms=${parts.mouth.scale.x.toFixed(2)},${parts.mouth.scale.y.toFixed(2)} mp=${parts.mouth.position.x.toFixed(3)},${parts.mouth.position.y.toFixed(3)},${parts.mouth.position.z.toFixed(3)}`;

    // 眨眼
    if (FREEZE) {
      if (FORCE_BLINK) setEyeOpen(0.06);
    } else {
      const sleepingNow = (MODE === 'sleep' || MODE === 'night') && wakeT < 0 && performance.now() > snoozeUntil;
      if (window.__sleepyEye != null) {
        setEyeOpen(window.__sleepyEye);
      } else if (window.__startleEye != null) {
        setEyeOpen(window.__startleEye);          // 驚醒：眼睛慢慢睜，不突然張大
      } else if (yawnT >= 0) {
        setEyeOpen(0.42 + 0.18 * Math.sin(yawnT * 6));
      } else if (sleepingNow) {
        setEyeOpen(0.07);
      } else if (wakeT >= 0) {
        wakeT += dt;
        const k = Math.min(wakeT / 0.45, 1);
        setEyeOpen(1 + 0.18 * Math.sin(k * Math.PI));
        if (wakeT > 0.6) { wakeT = -1; setEyeOpen(1); }
      } else {
      nextBlink -= dt;
      if (nextBlink <= 0 && blinkT < 0) { blinkT = 0; nextBlink = 2.8 + Math.random()*3.4; }
      if (blinkT >= 0) {
        blinkT += dt;
        const d = 0.13;
        const k = blinkT < d/2 ? blinkT/(d/2) : Math.max(0, 1 - (blinkT - d/2)/(d/2));
        setEyeOpen(1 - 0.94 * easeInOut(k));
        if (blinkT > d) { blinkT = -1; setEyeOpen(1); }
      }
      }
    }

    // ZZZ：睡眠時在頭旁邊往上飄（三顆由小到大）
    buildZZZ();
    if (MODE === 'night' && performance.now() > snoozeUntil && parts.head) {
      const hv = new THREE.Vector3();
      parts.head.getWorldPosition(hv);
      hv.y += 0.90; hv.x += 0.42;
      const pv = hv.project(camera);
      const bx = (pv.x * 0.5 + 0.5) * innerWidth, by = (-pv.y * 0.5 + 0.5) * innerHeight;
      zzzEls.forEach((d, i) => {
        const ph = ((t / 4.8) + i / 3) % 1;   // 每 1.6 秒一顆
        const sc = 0.55 + ph * 0.95, op = ph < 0.15 ? ph / 0.15 : (ph > 0.75 ? (1 - ph) / 0.25 : 1);
        d.style.opacity = String(0.92 * Math.max(0, op));
        d.style.transform = `translate(${bx + 14 + ph * 26}px, ${by - ph * 92}px) scale(${sc})`;
      });
    } else zzzEls.forEach(d => d.style.opacity = '0');

    // 汗滴（2D 圖層，跟著頭的位置）
    if (MODE === 'overspend') {
      if (!window.__sweat2d) {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;width:14px;height:18px;pointer-events:none;z-index:60;'
          + 'background:linear-gradient(180deg,#bfe6ff,#7fc7ee);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;'
          + 'clip-path:polygon(50% 0%,85% 45%,85% 70%,50% 100%,15% 70%,15% 45%);opacity:0';
        document.body.appendChild(d);
        window.__sweat2d = d;
      }
      const d = window.__sweat2d;
      const v = new THREE.Vector3();
      if (parts.head) {
        const wp = new THREE.Vector3();
        parts.head.getWorldPosition(wp);
        wp.x += 0.62; wp.y += 0.30;
        v.copy(wp).project(camera);
        d.style.left = ((v.x * 0.5 + 0.5) * innerWidth + 4) + 'px';
        d.style.top = ((-v.y * 0.5 + 0.5) * innerHeight + (t % 2.6) / 2.6 * 26) + 'px';
        d.style.opacity = String(0.9 * (1 - Math.max(0, ((t % 2.6) / 2.6 - 0.75) / 0.25)));
        d.style.transform = `scale(${0.85 + ((t % 2.6) / 2.6) * 0.35})`;
      }
    } else {
      if (window.__sweat2d) window.__sweat2d.style.opacity = '0';
      if (window.__body && Math.abs(window.__body.scale.y - 1) > 0.001) window.__body.scale.y += (1 - window.__body.scale.y) * Math.min(1, dt * 6);
    }

    // 超支：內疚 / 喪氣（頭低、眼睛半閉、身體微微下沉、緩慢晃）
    if (MODE === 'overspend') {
      if (window.__headRotate) window.__headRotate(0.018 * Math.sin(t * 1.5), 0.27 + 0.022 * Math.sin(t * 2.1));
      window.__lift = -0.022;
      if (window.__body) window.__body.scale.y = 0.975;   // 垮下去的感覺
      setEyeOpen(0.48 + 0.07 * Math.sin(t * 1.3));
    }

    // 打盹：頭緩慢沉下去、快速抬起來（週期 3.6 秒）
    if ((MODE === 'sleep' || MODE === 'night') && performance.now() > snoozeUntil) {
      const cyc = (t % 4.0) / 4.0;
      let nod;
      if (cyc < 0.60) nod = Math.pow(cyc / 0.60, 0.85);          // 2.4 秒慢慢沉下去
      else if (cyc < 0.69) { const k = (cyc - 0.60) / 0.09; nod = (1 - k) * (1 + 0.12 * Math.sin(k * Math.PI)); }  // 0.36 秒抬起，帶回彈
      else nod = 0;                                               // 之後撐著 1.4 秒
      if (window.__headRotate) window.__headRotate(0.105 * Math.sin(t * 0.85), 0.05 + 0.13 * nod);   // 點頭小(7.4°)、左右晃大(12°)
      window.__lift = 0;            // 身體完全不動
    }

    // 睡回去（snooze 到期）
    if ((MODE === 'sleep' || MODE === 'night') && performance.now() > snoozeUntil && expr === 'neutral' && wakeT < 0) {
      enterSleep();
    }

    // 4 秒沒互動 → 表情自動回到笑臉
    if (!FREEZE && MODE === 'idle' && expr !== 'smile' && performance.now() - lastTap > 4000) { expr = 'smile'; applyExpression(); }

    // 腮紅：點擊閃一下，再慢慢退
    if (SHOW_BLUSH) blushAmt = 0.85;
    blushAmt += (blushTarget - blushAmt) * Math.min(1, dt*1.6);
    blush.forEach(b => { b.material.opacity = Math.max(0, blushAmt) * 0.85; });
  }

  renderer.render(scene, camera);
}

/* ── 睡覺 / 晚上 / 超支 ── */
let sky = null, cap = null, NIGHT = false;
const BG_DAY = '';
const BG_NIGHT = 'linear-gradient(180deg,#2a2350 0%,#3b2f66 45%,#5a4180 75%,#7a5390 100%)';
const BG_OVER  = 'linear-gradient(180deg,#dfe3ee 0%,#e8dbe4 60%,#efd6dc 100%)';

function buildSky() {

  body.addColorStop(1, '#ffe9a6');
  c.beginPath(); c.arc(80, 80, 44, 0, Math.PI * 2); c.fillStyle = body; c.fill();
  // 挖掉左上方 → 開口朝左上

  for (let i = 0; i < 26; i++) {

      new THREE.MeshBasicMaterial({ color: 0xfff6cf, transparent: true, opacity: 0.85, depthWrite: false, toneMapped: false }));
    st.position.set((Math.random() - 0.5) * 7.5, (Math.random() - 0.15) * 4.4, -3 - Math.random() * 0.8);
    st.userData.tw = Math.random() * 6.28;

}

function makeStrandTex() {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, 64, 64);
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * 64, y = Math.random() * 64;
    const l = 3 + Math.random() * 7;
    c.strokeStyle = `rgba(255,${170 + Math.random() * 50 | 0},${210 + Math.random() * 30 | 0},${0.25 + Math.random() * 0.45})`;
    c.lineWidth = 0.8 + Math.random() * 0.9;

  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function noiseDisplace(geo, amp) {
  const p = geo.attributes.position;
  const n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const k = amp * (Math.random() - 0.5) * 2;
    p.setXYZ(i, p.getX(i) + n.getX(i) * k, p.getY(i) + n.getY(i) * k, p.getZ(i) + n.getZ(i) * k);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

function buildCap() {
  if (cap || !parts.head) return;
  const bb = new THREE.Box3().setFromObject(parts.head);
  const topWorld = new THREE.Vector3((bb.min.x + bb.max.x) / 2, bb.max.y, (bb.min.z + bb.max.z) / 2);
  const local = window.__body.worldToLocal(topWorld.clone());
  const knitTex = (() => {
    const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
    const c = cv.getContext('2d');
    c.fillStyle = '#ffb3d6'; c.fillRect(0, 0, 128, 128);
    for (let x = 0; x < 128; x += 2) {
      const l = 78 + Math.random() * 12;
      c.fillStyle = `hsl(335, 100%, ${l}%)`;
      c.fillRect(x + Math.random() * 0.8, 0, 1.4, 128);
    }
    for (let y = 0; y < 128; y += 6) {
      c.fillStyle = 'rgba(255,255,255,0.16)';
      c.fillRect(0, y, 128, 1.2);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 2);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  const pink = new THREE.MeshStandardMaterial({ color: 0xffffff, map: knitTex, roughness: 1.0, flatShading: true });
  const white = new THREE.MeshStandardMaterial({ color: 0xfff8fb, roughness: 1.0, flatShading: true });

  /* ── A：圓頂毛帽（半球帽身 + 帽沿 + 毛球） ── */
  const capA = new THREE.Group();
  const dome = new THREE.Mesh(
    noiseDisplace(new THREE.SphereGeometry(0.50, 30, 16, 0, Math.PI * 2, 0, Math.PI * 0.52), 0.013),
    pink);
  dome.scale.y = 0.82; dome.position.y = 0.10;
  const brim = new THREE.Mesh(
    noiseDisplace(new THREE.TorusGeometry(0.485, 0.075, 10, 34), 0.008), pink);
  brim.rotation.x = Math.PI / 2; brim.position.y = 0.10;
  const pomA = new THREE.Mesh(noiseDisplace(new THREE.SphereGeometry(0.135, 20, 15), 0.018), white);
  pomA.position.y = 0.52;
  capA.add(dome, brim, pomA);

  /* ── C：幾何毛髮（細圓柱一根一根） ── */
  const capC = new THREE.Group();
  const coneC = new THREE.Mesh(new THREE.ConeGeometry(0.57, 0.64, 26, 1), pink);
  coneC.position.y = 0.30;
  const bandC = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.59, 0.14, 26, 1, true), pink);
  bandC.position.y = 0.02;
  capC.add(coneC, bandC);
  const hairs = [];
  const N = 900;
  for (let i = 0; i < N; i++) {
    const hh = Math.pow(Math.random(), 0.7);            // 0 底 1 尖
    const ang = Math.random() * Math.PI * 2;
    const rr = 0.57 * (1 - hh) + 0.01;
    const len = 0.016 + Math.random() * 0.020;
    const g = new THREE.CylinderGeometry(0.0032, 0.0016, len, 3, 1, true);
    g.rotateZ((Math.random() - 0.5) * 1.2);
    g.rotateX((Math.random() - 0.5) * 1.2);
    g.translate(Math.cos(ang) * rr, 0.02 + hh * 0.60 + len * 0.35, Math.sin(ang) * rr);
    hairs.push(g);
  }
  const hairGeo = mergeGeometries(hairs, false);
  if (hairGeo) capC.add(new THREE.Mesh(hairGeo, new THREE.MeshStandardMaterial({ color: 0xffc2de, roughness: 1, flatShading: true })));
  const pomCgeo = [];
  for (let i = 0; i < 260; i++) {
    const ang = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const g = new THREE.CylinderGeometry(0.003, 0.0016, 0.02 + Math.random() * 0.015, 3, 1, true);
    const r0 = 0.145;
    g.translate(Math.cos(ang) * r0, 0.68 + Math.cos(ph) * r0, Math.sin(ang) * r0);
    pomCgeo.push(g);
  }
  const pomGeo = mergeGeometries(pomCgeo, false);
  if (pomGeo) capC.add(new THREE.Mesh(pomGeo, white));

  cap = new THREE.Group();
  cap.add(capA, capC);
  capC.visible = false;
  cap.userData.A = capA; cap.userData.C = capC;
  cap.visible = false;
  // 用「幾何本身的包圍盒」定位：頭不管轉到什麼角度，帽子的位置都不會飄
  if (!parts.head.geometry.boundingBox) parts.head.geometry.computeBoundingBox();
  const gb = parts.head.geometry.boundingBox;
  const hs = new THREE.Vector3(); parts.head.getWorldScale(hs);
  const headH = gb.max.y - gb.min.y;
  cap.position.set((gb.min.x + gb.max.x) / 2, gb.max.y - headH * 0.05, (gb.min.z + gb.max.z) / 2);
  cap.rotation.z = 0.04;
  const headW = gb.max.x - gb.min.x;
  cap.scale.setScalar(0.52 * headW);   // 帽寬 ≈ 頭寬 52%（帽體直徑 1.0 單位）
  parts.head.add(cap);
  window.__cap = cap;
}

/* ── 睡眠泡泡 ── */
const bubbles = [];
let bubbleT = -1, snoozeUntil = 0, startled = -1;
function spawnBubble() {
  if (!window.__body) return;
  const r = 0.055 + Math.random() * 0.025;
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.42, depthWrite: false });
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), mat);
  m.position.set(0.34 + Math.random() * 0.08, -0.16, 0.50);   // 從嘴巴旁邊冒出（跟 ZZZ 分開）
  m.userData = { life: 0, dur: 2.6, alive: true, popT: -1 };
  const hi = new THREE.Mesh(new THREE.SphereGeometry(r * 0.28, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false }));
  hi.position.set(-r * 0.35, r * 0.4, r * 0.55);
  m.add(hi);
  window.__body.add(m);
  bubbles.push(m);
  if (bubbles.length > 8) { const old = bubbles.shift(); old.parent && old.parent.remove(old); }
}
const _ray = new THREE.Raycaster();
function hitBubble(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  _ray.setFromCamera(ndc, camera);
  const live = bubbles.filter(b => b.userData.alive && b.visible);
  if (!live.length) return null;
  const hits = _ray.intersectObjects(live, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && !live.includes(o)) o = o.parent;
  return o || null;
}
function popBubble(b) {
  b.userData.alive = false;
  b.userData.popT = 0;
  startleWake();
}
function startleWake() {
  wakeT = -1;
  bubbles.forEach(b => { if (b.userData.alive && b.visible) { b.userData.alive = false; b.userData.popT = 0; } });
  snoozeUntil = performance.now() + 5000;   // 5 秒後再睡回去
  wakeT = 0; startled = 0; idleT = 0;
  expr = 'neutral'; applyExpression(true);
  if (window.__headRotate) window.__headRotate(0, 0);
}

function setHat(v) {
  buildCap();
  if (!cap) return;
  cap.userData.A.visible = (v === 'A');
  cap.userData.C.visible = (v === 'C');
}
window.__setHat = setHat;

let sweat = null;
function buildSweat() {
  if (sweat || !parts.head) return;
  const mat = new THREE.MeshStandardMaterial({ color: 0x9fd8f5, roughness: 0.25, metalness: 0.05, transparent: true, opacity: 0.9, flatShading: true });
  sweat = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), mat);

}

function enterSleep() {
  MODE = (NIGHT ? 'night' : 'sleep');
  wakeT = -1; snoozeUntil = 0; startled = -1;
  expr = 'neutral'; applyExpression(true);       // 睡覺嘴巴 = 普通（橫線）
  if (window.__headRotate) window.__headRotate(0, 0.16);   // 頭往前打盹
}
function enterWake() {
  MODE = 'idle';
  wakeT = 0; idleT = 0; yawnT = -1; snoozeUntil = 0; startled = -1;
  if (window.__headRotate) window.__headRotate(0, 0);
  expr = 'smile'; applyExpression(true);
}
function setMode(m) {
  buildSky(); buildCap();
  if (m === 'night') {
    NIGHT = true;
    document.body.style.background = BG_NIGHT;
    if (sky) sky.visible = true;
    if (cap) cap.visible = true;
    enterSleep();
  } else if (m === 'sleep') {
    NIGHT = false;
    document.body.style.background = BG_DAY;   // 睡覺不改背景
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    enterSleep();
  } else if (m === 'overspend') {
    MODE = 'overspend';
    NIGHT = false;
    document.body.style.background = BG_OVER;
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    idleT = 0; wakeT = 0; setEyeOpen(1);
    if (window.__headRotate) window.__headRotate(0, 0.20);   // 超支：頭往前低
    expr = 'sad'; applyExpression(true);
  } else {   // idle / wake
    MODE = 'idle'; NIGHT = false;
    document.body.style.background = BG_DAY;
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    enterWake();

}
window.__setMode = setMode;
window.__idleSet = v => { idleT = v; };
window.__fidget = k => { fidgetKind = k || 'scratch'; fidgetT = 0; };

/* ── 展示台按鈕 ── */
(function buildBar() {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:9px 9px 12px;overflow:visible;z-index:99;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,.06)';
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = 'flex:0 0 auto;padding:7px 11px;border-radius:11px;border:none;background:#ffd9ea;color:#8a3a63;font-size:13px;font-weight:700;font-family:inherit;box-shadow:0 2px 0 rgba(180,90,130,.25)';
    b.onclick = ev => { ev.stopPropagation(); fn(); };
    bar.appendChild(b);
  };
  mk('待機', () => setMode('idle'));
  mk('睡覺', () => setMode('sleep'));
  mk('起床', () => setMode('idle'));
  mk('晚上', () => setMode('night'));
  mk('超支', () => setMode('overspend'));
  mk('晃耳朵', () => { hairSwingT = 0; });
  mk('揮手', () => { waveT = 0; expr = 'smile'; applyExpression(true); });
  mk('跳', () => { if (jumpPhase === 'idle' && jumpY <= 0.001) { jumpPhase = 'crouch'; crouchT = 0; } });
  mk('帽子A', () => { setMode('night'); setHat('A'); });
  mk('帽子C', () => { setMode('night'); setHat('C'); });
  document.body.appendChild(bar);
  // 把原本的說明文字往上移
  const hint = document.querySelector('.hint, #hint');
  if (hint) hint.style.bottom = '108px';
})();

renderer.setAnimationLoop(tick);
</script>
</body>
</html>
