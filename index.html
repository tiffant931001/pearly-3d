<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;
    background:linear-gradient(180deg,#d4f4ff 0%,#dfe3ff 34%,#e6d2ff 66%,#eda8fe 100%);}
  canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font:13px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    color:#8a6a9e;opacity:.45;pointer-events:none;user-select:none}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/addons/"
}}
</script>
</head>
<body>
<div id="hint">v25 · 展示台（待機/睡覺/晚上/超支）</div>
<script>window.onerror=(m,src,l,c)=>{document.title='ERR '+m+' @'+l+':'+c;};</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('still'), LIT = Q.has('lit');
const EXPR = Q.get('expr');            // smile | neutral | sad（測試用）
const FORCE_BLINK = Q.has('blink');
const SHOW_BLUSH = Q.has('blush');
const WAVEAT = Q.has('waveat') ? parseFloat(Q.get('waveat')) : null;
const TFORCE = Q.has('ft') ? parseFloat(Q.get('ft')) : null;
const SWINGAT = Q.has('swingat') ? parseFloat(Q.get('swingat')) : null;
const WAMP = Q.has('wamp') ? parseFloat(Q.get('wamp')) : 0.95;
if (Q.has('key')) document.body.style.background = '#00ff00';

/* ── 場景 ───────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOV = Q.has('fov') ? parseFloat(Q.get('fov')) : 30;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 60);
window.__cam = camera;

// 光只加很淡的一層：主要明暗其實畫在頂點色裡（跟原圖一致）
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, Q.has('hemi') ? parseFloat(Q.get('hemi')) : 1.80));
const key = new THREE.DirectionalLight(0xffffff, Q.has('keyi') ? parseFloat(Q.get('keyi')) : 0.42); key.position.set(0.8, 2.2, 3.2);
const fill = new THREE.DirectionalLight(0xffeef8, 0.22); fill.position.set(-3, 0.6, 1.6);
// 左右側光：把耳朵/手臂外側提亮（原畫的柔和均勻感）
const SID = Q.has('sid') ? parseFloat(Q.get('sid')) : 1.00;
const sidL = new THREE.DirectionalLight(0xffffff, SID); sidL.position.set(-3.2, 0.4, 0.6);
const sidR = new THREE.DirectionalLight(0xffffff, SID); sidR.position.set( 3.2, 0.4, 0.6);
scene.add(key, fill, sidL, sidR);

const spin = new THREE.Group();       // 水平旋轉（360°）
const tiltOuter = new THREE.Group();  // 上下俯仰
tiltOuter.add(spin);
scene.add(tiltOuter);
const hop = new THREE.Group();        // 跳躍 / 擠壓
spin.add(hop);

/* ── 狀態 ───────────────────────────────── */
let loaded = false, baseScale = 1, modelH = 1, modelW = 1;
const parts = window.__parts = { ears: [], eyes: [], arms: [], mouth: null, head: null };
const blush = [];
const clock = new THREE.Clock();
let t = 0;
let yaw = 0, pitch = 0, yawV = 0, pitchV = 0;      // 拖曳
let dragging = false, lastX = 0, lastY = 0, lastMove = 0;
let expr = EXPR || 'smile';
/* ── 模式與待機狀態 ── */
let MODE = 'idle';           // idle | sleep | night | overspend
let idleT = 0, yawnT = -1, wakeT = -1;
let jumpPhase = 'idle', crouchT = 0;
let blinkT = -1, nextBlink = 3.0;
let blushAmt = 0, blushTarget = 0;
let squash = 0, squashV = 0, jumpY = 0, jumpV = 0;
const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;

/* ── 腮紅貼圖（照她手畫的樣式：橫向霧狀帶 + 眼下小黑橢圓）── */
function blushTexture(){
  const w = 256, h = 256, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  gr.addColorStop(0.00, 'rgba(255,255,255,1)');
  gr.addColorStop(0.30, 'rgba(255,255,255,0.88)');
  gr.addColorStop(0.55, 'rgba(255,255,255,0.45)');
  gr.addColorStop(0.78, 'rgba(255,255,255,0.12)');
  gr.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function ovalTexture(){
  const w = 256, h = 160, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.strokeStyle = '#232323'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath();
  // 手繪感：稍微歪、不完全閉合
  g.ellipse(w*0.5, h*0.5, w*0.36, h*0.30, -0.12, 0.15, Math.PI*1.92);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ── 載入模型 ───────────────────────────── */
new GLTFLoader().load('./model/character.glb', (gltf) => {
  const src = gltf.scene;
  src.updateMatrixWorld(true);
  const meshes = [];
  src.traverse(o => { if (o.isMesh) meshes.push(o); });

  const body = new THREE.Group();
  const tex = blushTexture();

  meshes.forEach(o => {
    let geo = o.geometry.clone();
    geo.applyMatrix4(o.matrixWorld);
    // 把重複頂點合併 → 法線才會平滑（原檔是逐面拆開的，否則會一片片硬邊）
    const vBefore = geo.attributes.position.count;
    try { geo = mergeVertices(geo, 1e-3); } catch (err) {}
    window.__vert = (window.__vert || '') + vBefore + '->' + geo.attributes.position.count + ' ';
    geo.computeBoundingBox();
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    const size = geo.boundingBox.getSize(new THREE.Vector3());
    geo.translate(-c.x, -c.y, -c.z);
    geo.computeVertexNormals();

    // 頂點色比原畫鮮豔很多 → 用 gamma 提亮／降對比，讓它接近原圖的奶感
    const GAM = Q.has('gam') ? parseFloat(Q.get('gam')) : 0.70;
    const ca = geo.attributes.color;
    if (ca && GAM !== 1) {
      for (let i = 0; i < ca.count; i++) {
        ca.setXYZ(i, Math.pow(ca.getX(i), GAM), Math.pow(ca.getY(i), GAM), Math.pow(ca.getZ(i), GAM));
      }
      ca.needsUpdate = true;
    }

    const DES = Q.has('des') ? parseFloat(Q.get('des')) : 0.26;
    if (ca && DES > 0) {
      for (let i = 0; i < ca.count; i++) {
        const r = ca.getX(i), g = ca.getY(i), b = ca.getZ(i);
        const l = 0.299*r + 0.587*g + 0.114*b;
        ca.setXYZ(i, r + (l-r)*DES, g + (l-g)*DES, b + (l-b)*DES);
      }
      ca.needsUpdate = true;
    }

    const mat = Q.has('basic')
      ? new THREE.MeshBasicMaterial({ vertexColors: true })
      : new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 1, metalness: 0,
          flatShading: !Q.has('smooth'), side: THREE.FrontSide,
          emissive: 0xffffff, emissiveIntensity: 0.03   // 極輕微提亮，避免死黑
        });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(c);
    mesh.userData.size = size;
    mesh.userData.center = c.clone();
    body.add(mesh);

    const ax = Math.abs(c.x);
    if (size.z < 0.12 && size.x < 0.25 && size.y > 0.15 && c.z > 0.35) parts.eyes.push(mesh);
    else if (size.y < 0.12 && size.x < 0.15 && c.z > 0.35) parts.mouth = mesh;
    else if (ax > 0.45 && size.y > 0.90) { mesh.material.color.setScalar(1.34); parts.arms.push(mesh); }
    else if (ax > 0.45 && size.y > 0.55 && size.y < 0.85) { mesh.material.color.setScalar(1.12); parts.ears.push(mesh); }
    else if (size.x > 0.9) { mesh.material.color.setScalar(0.97); parts.head = mesh; }
  });

  // 置中 + 縮放（高度 = 2）
  body.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(body);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  body.position.sub(center);
  baseScale = 2.0 / size.y;
  window.__bodyBaseY = body.position.y;
  modelH = size.y; modelW = size.x;
  hop.scale.setScalar(baseScale);
  hop.add(body);
  window.__body = body;
  window.__hop = hop;

  /* 普通表情用的短橫線嘴巴（顏色沿用嘴巴本身的粉紅） */
  if (parts.mouth) {
    const mc = new THREE.Color(1,1,1);
    const cAttr = parts.mouth.geometry.attributes.color;
    if (cAttr) {
      let r=0,g=0,b=0;
      for (let i=0;i<cAttr.count;i++){ r+=cAttr.getX(i); g+=cAttr.getY(i); b+=cAttr.getZ(i); }
      const n = cAttr.count; mc.setRGB(r/n, g/n, b/n);
    }
    // 用「管子」做嘴巴（跟 ^ 一樣是真幾何，不會被臉切到）
    // 用「畫上去的圓角線條」做嘴巴：乾淨、不出現切面
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 180;
    const g2 = cv.getContext('2d');
    g2.strokeStyle = '#fff'; g2.lineWidth = 108; g2.lineCap = 'round';
    g2.beginPath();
    g2.moveTo(70, 78);
    g2.quadraticCurveTo(256, 108, 442, 78);   // 中間微微低、兩端微上揚
    g2.stroke();
    const ltex = new THREE.CanvasTexture(cv);
    ltex.colorSpace = THREE.SRGBColorSpace;
    ltex.anisotropy = 8;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.082, 0.029),
      new THREE.MeshBasicMaterial({ map: ltex, color: mc, transparent: true, depthWrite: false, toneMapped: false })
    );
    const p0 = parts.mouth.position;
    line.position.set(p0.x, p0.y + 0.002, p0.z + (Q.has('mz') ? parseFloat(Q.get('mz')) : 0.025));
    line.visible = false;
    parts.mouth.parent.add(line);
    parts.mouthLine = line;
  }

  /* 旋轉樞紐：手臂繞肩、耳朵繞根部 */
  function addPivot(mesh, px, py, innerSign){
    const g = new THREE.Group();
    g.position.set(px, py, mesh.position.z);
    const off = new THREE.Vector3(mesh.position.x - px, mesh.position.y - py, 0);
    mesh.position.copy(off);
    mesh.parent.remove(mesh);
    g.add(mesh); body.add(g);
    g.userData.innerSign = innerSign;
    return g;
  }
  // 用「世界座標」重新認零件：頭髮＝兩大顆、手＝兩顆小錐形、裙子＝中間那片
  if (parts.eyes.length) {
    const e0 = new THREE.Box3().setFromObject(parts.eyes[0]).getCenter(new THREE.Vector3());
    parts.eyeCenterX = Math.abs(e0.x); parts.eyeCenterY = e0.y;
  }
  body.updateMatrixWorld(true);
  parts.hair = []; parts.hands = []; parts.skirt = null;
  body.children.filter(o => o.isMesh).forEach(o => {
    const bb = new THREE.Box3().setFromObject(o);
    const sz = bb.getSize(new THREE.Vector3());
    const c0 = bb.getCenter(new THREE.Vector3());
    if (o !== parts.head && sz.x > 0.50 && sz.y > 0.60 && c0.y > 0.05 && o.geometry.attributes.position.count < 150) {
      parts.hair.push(o);
      const inner = c0.x < 0 ? 1 : -1;
      o.userData.pivot = addPivot(o, c0.x + inner*sz.x*0.28, c0.y - sz.y*0.28, inner);
    } else if (Math.abs(c0.x) > 0.18 && Math.abs(c0.x) < 0.36 && c0.y < -0.28 && sz.x < 0.45) {
      parts.hands.push(o);
      o.userData.innerSign = c0.x < 0 ? 1 : -1;
      o.userData.center = c0.clone();
    } else if (Math.abs(c0.x) < 0.06 && sz.x > 0.35 && sz.x < 0.58 && sz.y < 0.36) {
      parts.skirtTopLocal = c0.y + sz.y * 0.5;   // body 座標（不帶世界位移）
      parts.skirt = addPivot(o, c0.x, c0.y + sz.y*0.48, 1);
    }
    if (sz.x > 0.90 && Math.abs(c0.x) < 0.10) { parts.head = o; parts.headCenter = c0.clone(); parts.headRadius = sz.x * 0.5; parts.headDepth = sz.z * 0.5; }
  });

  // 手：固定點放在裙子上緣（不是在臉旁邊），轉動時就像從身體長出來
  const handPivotY = (parts.skirtTopLocal !== undefined ? parts.skirtTopLocal - 0.015 : -0.40);
  parts.hands.forEach(o => {
    const c0 = o.userData.center, inner = o.userData.innerSign;
    const g = addPivot(o, c0.x + inner * 0.02, handPivotY, inner);
    o.userData.pivot = g;
    if (c0.x < 0) parts.handWave = g; else parts.handOther = g;
  });


  /* 頭部整體微動：頭、眼睛、嘴巴、腮紅繞脖子同一點旋轉（臉一定跟著頭） */
  window.__headRotate = function (a) {
    if (!parts.head) return;
    const list = [parts.head, ...(parts.eyes || []), parts.mouth, parts.mouthLine, ...(parts.blushList || [])].filter(Boolean);
    const neckY = (parts.headCenter ? parts.headCenter.y : 0) - (parts.headRadius || 0.49) * 0.72;
    const c = Math.cos(a), sn = Math.sin(a);
    list.forEach(m => {
      if (m.userData._bx === undefined) { m.userData._bx = m.position.x; m.userData._by = m.position.y; m.userData._br = m.rotation.z; }
      const x = m.userData._bx, y = m.userData._by - neckY;
      m.position.x = x * c - y * sn;
      m.position.y = neckY + (x * sn + y * c);
      if (m !== parts.mouth && m !== parts.mouthLine) m.rotation.z = m.userData._br + a;
    });
  };

  /* 綠色長條（兩側大片的頭髮）：也給根部樞紐，讓它跟粉紅圓球一起甩 */
  parts.greenHair = [];
  body.updateMatrixWorld(true);
  const _cands = [];
  body.traverse(o => {
    if (!o.isMesh) return;
    if (o === parts.head || o.userData.pivot) return;
    if ((parts.hair || []).includes(o) || (parts.hands || []).includes(o) || o === parts.skirt) return;
    _cands.push(o);
  });
  _cands.forEach(o => {
    const bb = new THREE.Box3().setFromObject(o);
    const sz = bb.getSize(new THREE.Vector3());
    const c0 = bb.getCenter(new THREE.Vector3());
    if (sz.y > 0.95 && sz.x > 0.50 && sz.x < 0.85 && o.geometry.attributes.position.count < 400) {
      parts.greenHair.push(o);
      const inner = c0.x < 0 ? 1 : -1;
      o.userData.pivot = addPivot(o, c0.x + inner * sz.x * 0.22, c0.y + sz.y * 0.44, inner);
    }
  });

  /* 腮紅：貼在臉頰，朝外 */
  if (parts.head) {
    const hc = parts.headCenter || new THREE.Vector3(0, 0, 0);
    [[-1], [1]].forEach(([sx]) => {
      // 橫向霧狀腮紅帶
      const m = new THREE.Mesh(
        new THREE.CircleGeometry(0.115, 28),
        new THREE.MeshBasicMaterial({
          map: tex, color: 0xff8ac4, transparent: true, depthWrite: false,
          opacity: 0, toneMapped: false, blending: THREE.NormalBlending
        })
      );
      const eyeX = (parts.eyeCenterX || 0.19) * 1.02;
      const rxz = Math.max(0, (parts.headRadius||0.47) ** 2 - eyeX ** 2);
      const zSurf = hc.z + Math.sqrt(rxz) * 0.90;
      m.position.set(sx * eyeX, (parts.eyeCenterY || 0) - 0.105, zSurf + 0.055);
      m.rotation.y = sx * 0.28;
      body.add(m);
      (parts.blushList = parts.blushList || []).push(m);
      m.renderOrder = 10;
      blush.push(m);

    });
  }

  camera.position.set(0, 0.05, 6.2);
  fitCamera();
  if (Q.has('list')) { const out=[]; body.traverse(o=>{ if(o.isMesh && o.geometry){ const bb=new THREE.Box3().setFromObject(o); const sz=new THREE.Vector3(); bb.getSize(sz); const c=new THREE.Vector3(); bb.getCenter(c); out.push([o.name, +c.x.toFixed(2), +c.y.toFixed(2), +c.z.toFixed(2), +sz.x.toFixed(2), +sz.y.toFixed(2), +sz.z.toFixed(2), o.geometry.attributes.position.count]); } }); document.title = 'LIST'+JSON.stringify(out); }
  if (Q.has('bl')) { const info=[]; blush.forEach(b=>{ b.updateWorldMatrix(true,false); const w=new THREE.Vector3(); b.getWorldPosition(w); info.push({local:[+b.position.x.toFixed(2),+b.position.y.toFixed(2),+b.position.z.toFixed(2)], world:[+w.x.toFixed(2),+w.y.toFixed(2),+w.z.toFixed(2)], parent: b.parent.type + ':' + [b.parent.position.x.toFixed(2),b.parent.position.y.toFixed(2)].join(',')}); }); document.title='BL'+JSON.stringify(info); }
  if (Q.has('hh')) { parts.hands.forEach(h=>h.visible=false); }
  if (Q.has('hhi')) { parts.hands.forEach(h=>{ h.material.color.set(0xff0000); }); }
  if (Q.has('hw')) { const g=parts.handWave; const b=parts.handWave&&parts.handWave.children[0]; const w=new THREE.Vector3(); if(g) g.getWorldPosition(w); document.title='HW'+JSON.stringify({has:!!g, gpos:g?[+g.position.x.toFixed(2),+g.position.y.toFixed(2),+g.position.z.toFixed(2)]:null, world:[+w.x.toFixed(2),+w.y.toFixed(2),+w.z.toFixed(2)], hands:parts.hands.length, vis: b?b.visible:null}); }
  if (Q.has('dbg')) { const m=parts.mouth; document.title = m ? `mr=${m.rotation.x.toFixed(2)},${m.rotation.y.toFixed(2)},${m.rotation.z.toFixed(2)} mp=${m.position.x.toFixed(3)},${m.position.y.toFixed(3)},${m.position.z.toFixed(3)} ms=${m.scale.x.toFixed(2)},${m.scale.y.toFixed(2)},${m.scale.z.toFixed(2)}` : 'no mouth'; }
  if (Q.has('yaw'))   { yaw = parseFloat(Q.get('yaw')); }
  if (Q.has('pitch')) { pitch = parseFloat(Q.get('pitch')); }
  if (Q.has('expr'))  { expr = Q.get('expr'); applyExpression(true); }
  loaded = true;
  applyExpression(true);
  lastTap = performance.now();
  window.__ready = true;
  if (Q.has('auto')) { setTimeout(() => tap(), 550); }
  if (Q.has('wave')) { setTimeout(() => { waveT = 0; expr = 'smile'; applyExpression(true); }, 400); }
  if (Q.has('taps')) {
    const n = parseInt(Q.get('taps')) || 3;
    for (let i = 0; i < n; i++) setTimeout(() => tap(), 500 + i * 220);
  }
}, undefined, e => { window.__err = String(e); });

/* ── 表情 ───────────────────────────────── */
const EXPRS = ['smile', 'neutral', 'sad'];
window.__jumpY = () => jumpY;
window.__exprGet = () => ({ expr, waveT, tapTimes: tapTimes.length, pending: pendingWave !== null });
function setEyeOpen(v){ parts.eyes.forEach(e => { e.scale.y = v; }); }
function applyExpression(instant){
  const m = parts.mouth;
  if (!m) return;
  const line = parts.mouthLine;
  m.rotation.z = 0; m.scale.set(1, 1, 1);
  if (line) line.visible = false;
  if (expr === 'smile')      { m.visible = true;  m.rotation.z = Math.PI; }   // ∨ = 開心
  if (expr === 'sad')        { m.visible = true;  m.rotation.z = 0;       }   // ^ = 不開心
  if (expr === 'neutral')    {
    m.visible = false;
    if (line) line.visible = true;
    else { m.visible = true; m.scale.set(1, 0.22, 1); }   // 沒有線模型時退回舊做法
  }
  blushTarget = 0;   // 靜止時不上腮紅，點了才冒
}

/* ── 互動 ───────────────────────────────── */
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; lastMove = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const K = 0.012;
  idleT = 0; lastTap = performance.now();
  yaw   += dx * K;                       // 直接跟手
  pitch += dy * K * 0.55;
  yawV   = dx * K * 14;                  // 放開後的慣性
  pitchV = dy * K * 8;
  lastMove = performance.now();
  if (Math.abs(dx) + Math.abs(dy) > 2) el.dataset.dragged = '1';
});
el.addEventListener('pointerup', e => {
  dragging = false;
  el.releasePointerCapture?.(e.pointerId);
  if (el.dataset.dragged !== '1') tap();
  el.dataset.dragged = '0';
});

let tapCount = 0, lastTap = -1e9;
let waveT = -1, hairSwingT = -1, tapTimes = [], pendingWave = null, pendingJump = null;
let earTwitch = [-1, -1], nextTwitch = [5, 7];
function tap(){
  idleT = 0;
  if (MODE === 'sleep' || MODE === 'night') { setMode('idle'); return; }
  // 腮紅立刻回饋（不等判定）
  blushAmt = Math.max(blushAmt, 0.9);
  const now = performance.now();
  tapTimes = tapTimes.filter(x => now - x < 700);
  tapTimes.push(now);
  const n = tapTimes.length;

  if (n === 1) {
    // 點一下 → 等 230ms 確認不是連點才跳（連點時整隻不動，頭才不會晃）
    clearTimeout(pendingJump);
    pendingJump = setTimeout(() => {
      if (tapTimes.length === 1) {
        if (jumpPhase === 'idle' && jumpY <= 0.001) { jumpPhase = 'crouch'; crouchT = 0; }
        tapCount++;
        if (tapCount > 1) expr = EXPRS[(EXPRS.indexOf(expr) + 1) % EXPRS.length];
        applyExpression();
      }
    }, 120);
  } else if (n === 2) {
    clearTimeout(pendingJump);
    clearTimeout(pendingWave);
    pendingWave = setTimeout(() => {
      pendingWave = null;
      if (tapTimes.length === 2) { waveT = 0; expr = 'smile'; applyExpression(true); }   // 揮手一定笑臉
    }, 240);
  } else {
    clearTimeout(pendingJump);
    clearTimeout(pendingWave);
    pendingWave = null;
    hairSwingT = 0;      // 晃耳朵（不跳，頭不動）
    tapTimes = [];
  }
  lastTap = now;
}

let _rzTimer = null;
addEventListener('resize', () => {
  clearTimeout(_rzTimer);
  _rzTimer = setTimeout(() => {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (loaded) fitCamera();
  }, 120);
});

function fitCamera(){
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const halfW = modelW * baseScale / 2;     // 角色實際橫向半寬（含耳朵）
  const dH = (modelH*baseScale/2 * 1.02) / tan;
  const dW = (halfW * 1.06) / (tan * camera.aspect);
  camera.position.z = Math.max(dH, dW) * (1 + 0.075 * (window.__waveZoom || 0));
  camera.lookAt(0, 0, 0);
}

/* ── 主迴圈 ─────────────────────────────── */
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!FREEZE) t += dt;

  if (loaded) {
    // 拖曳慣性 + 靜止 2.5 秒後慢慢轉回正面
    if (!dragging) {
      yaw   += yawV * dt;
      pitch += pitchV * dt;
      yawV *= 0.90; pitchV *= 0.90;
      const idle = performance.now() - lastMove;
      if (!FREEZE && idle > 900 && Math.abs(yawV) < 0.35 && Math.abs(pitchV) < 0.35) {
        const twoPi = Math.PI * 2;
        const nearest = Math.round(yaw / twoPi) * twoPi;   // 最短角度回正面
        yaw   += (nearest - yaw) * Math.min(1, dt * 3.0);
        pitch += (0 - pitch)      * Math.min(1, dt * 3.6);
      }
    }
    const ar = renderer.domElement.clientWidth / renderer.domElement.clientHeight;
    if (Math.abs(ar - camera.aspect) > 0.02) {     // 只有明顯變化才重算，避免每幀抖動
      camera.aspect = ar; camera.updateProjectionMatrix();
      renderer.setSize(renderer.domElement.clientWidth, renderer.domElement.clientHeight);
      fitCamera();
    }
    pitch = THREE.MathUtils.clamp(pitch, -0.55, 0.55);
    spin.rotation.y = yaw;
    tiltOuter.rotation.x = pitch;

    // 靜止基準
    hop.scale.set(baseScale, baseScale, baseScale);


    // 22:00 之後（或 06:00 前）自動進入晚上模式
    if (loaded && !window.__autoNight) {
      window.__autoNight = true;
      const hh = new Date().getHours();
      if (hh >= 22 || hh < 6) setMode('night');
    }

    // 待機 30 秒（任何點擊或拖曳都重新計時）→ 打哈欠 → 睡著
    if (!FREEZE) {
      const busy = dragging || (performance.now() - lastTap < 900) || (performance.now() - lastMove < 900);
      if (busy) idleT = 0; else idleT += dt;
      if (MODE === 'idle' && idleT > 30 && yawnT < 0) { yawnT = 0; }
      if (yawnT >= 0) {
        yawnT += dt;
        if (yawnT > 1.5) { yawnT = -1; enterSleep(); }
      }
      if (sky && sky.visible) {
        sky.children.forEach(o => {
          if (o.userData.tw !== undefined) o.material.opacity = 0.30 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + o.userData.tw));
        });
      }
    }

    // 待機：整隻（頭+身體）一起慢慢上下漂浮；頭髮與手只做極小幅度的同相位浮動
    if (!FREEZE) {
      const nightOrSleep = (MODE === 'sleep' || MODE === 'night');
      const FT2 = nightOrSleep ? 6.2 : 4.6;
      const BODY_A = (MODE === 'overspend' || yawnT >= 0) ? 0.006 : (nightOrSleep ? 0.013 : 0.030);
      const ph0 = t * Math.PI * 2 / FT2;
      if (window.__body) {
        window.__body.position.y = (window.__bodyBaseY || 0) + BODY_A * Math.sin(ph0);
      }
      // 點三下：晃晃耳朵（小而快、兩邊同步、2.5 下）
      let sw0 = 0, sw1 = 0;
      if (SWINGAT !== null) { hairSwingT = SWINGAT; }
      if (hairSwingT >= 0) {
        hairSwingT += dt;
        const DUR = 0.62, CYCLES = 2.0, AMP = 0.157;   // ±9°、0.62 秒抖 2 下
        const p = hairSwingT / DUR;
        if (p >= 1) { hairSwingT = -1; }
        else { sw0 = sw1 = AMP * Math.sin(p * Math.PI * 2 * CYCLES) * Math.pow(1 - p, 1.5); }
      }
      parts.hair.forEach((h, i) => {
        const g = h.userData.pivot;
        if (!g) return;
        // 只旋轉、不位移 → 頭髮根部永遠黏在頭上
        g.rotation.z = (0.010 * Math.sin(ph0) + (hairSwingT >= 0 ? (i ? sw1 : sw0) : 0)) * g.userData.innerSign;
      });
      // 綠色長條：慢半拍、幅度一半
      (parts.greenHair || []).forEach((e, i) => {
        const g = e.userData.pivot;
        if (!g) return;
        let sw = 0;
        if (hairSwingT >= 0) {
          const p2 = (hairSwingT - 0.10) / 0.62;
          if (p2 > 0 && p2 < 1) sw = 0.078 * Math.sin(p2 * Math.PI * 2 * 2.0) * Math.pow(1 - p2, 1.5);
        }
        g.rotation.z = (0.007 * Math.sin(ph0 * 0.85 + i * 1.2) + sw) * g.userData.innerSign;
      });
      parts.hands.forEach(h => {
        const g = h.userData.pivot;
        if (!g) return;
        g.rotation.z = 0.035 * Math.sin(ph0) * g.userData.innerSign;   // 輕微擺動，不位移
      });
    }

    // 揮手（點兩下觸發）：把手往上抬 + 左右擺，離開身體才不會像抓癢
    if (waveT >= 0 || WAVEAT !== null) {
      waveT = (WAVEAT !== null) ? WAVEAT : waveT + dt;
      const DUR = 1.9;
      const p = Math.min(waveT / DUR, 1);
      if (expr !== 'smile') { expr = 'smile'; applyExpression(true); }   // 揮手期間一定是笑臉
      const ss = x => x * x * (3 - 2 * x);
      const env2 = ss(Math.min(p / 0.2, 1)) * ss(Math.min((1 - p) / 0.2, 1));
      const WLIFT = Q.has('wlift') ? parseFloat(Q.get('wlift')) : 0.030;
      const WROTX = Q.has('wrotx') ? parseFloat(Q.get('wrotx')) : 0.35;
      const g = parts.handWave;
      if (g) {
        if (g.userData.baseX === undefined) g.userData.baseX = g.position.x;
        if (g.userData.baseY === undefined) g.userData.baseY = g.position.y;
        if (g.userData.baseZ === undefined) g.userData.baseZ = g.position.z;
        const swing = Math.sin(waveT * 9.5);
        // i 版：往斜上舉到胸口外側（不往前伸），只做小幅左右擺
        g.rotation.z = (-0.26 + swing * 0.07) * env2 * -g.userData.innerSign;
        g.rotation.x = (-0.10 + swing * 0.03) * env2;
        g.position.x = g.userData.baseX - g.userData.innerSign * 0.022 * env2;
        g.position.y = g.userData.baseY + (0.022 + swing * 0.008) * env2;
        g.position.z = g.userData.baseZ + 0.030 * env2;
      }
      hop.rotation.z = 0.020 * env2;
      if (waveT > DUR) {
        waveT = -1;
        if (g) { g.position.x = g.userData.baseX; g.position.y = g.userData.baseY; g.position.z = g.userData.baseZ; g.rotation.set(0,0,0); g.scale.setScalar(1); }
        hop.rotation.z = 0;
        window.__waveZoom = 0; fitCamera();
      }
    }


    // 跳躍：蹲下預備(0.09s) → 起飛 → 重力 → 落地
    if (!FREEZE) {
      if (jumpPhase === 'crouch') {
        crouchT += dt;
        const k = Math.min(crouchT / 0.09, 1);
        squash = 0.13 * k; squashV = 0;                 // 蹲：壓扁
        if (k >= 1) { jumpPhase = 'air'; jumpV = 3.2; squash = -0.07; squashV = 0; }  // 起飛：拉長
      } else if (jumpPhase === 'air') {
        jumpV -= 11.0 * dt;
        jumpY += jumpV * dt;
        if (jumpY <= 0) { jumpY = 0; jumpV = 0; hop.position.y = 0; jumpPhase = 'idle'; squash = 0.20; squashV = 0; }
        else hop.position.y = jumpY;   // 落地：壓縮後由彈簧回彈
      }
    }

    // 擠壓彈簧（會回彈、不會卡住）
    squashV += (-300 * squash - 17 * squashV) * dt;
    squash += squashV * dt;
    squash = THREE.MathUtils.clamp(squash, -0.20, 0.22);
    hop.scale.x *= 1 + squash * 0.30;
    hop.scale.y *= 1 - squash * 0.34;
    if (Q.has('jit')) {
      const by = (window.__body ? window.__body.position.y : 0);
      window.__jb = window.__jb || {prev: by, max: 0, sum: 0, n: 0, prevT: t};
      const d = Math.abs(by - window.__jb.prev);
      window.__jb.max = Math.max(window.__jb.max, d);
      window.__jb.sum += d; window.__jb.n++;
      window.__jb.prev = by;
      document.title = `jit max=${window.__jb.max.toFixed(4)} avg=${(window.__jb.sum/window.__jb.n).toFixed(5)} dt=${dt.toFixed(3)} n=${window.__jb.n}`;
    }
    if (Q.has('dbg')) document.title = `hw=${parts.handWave?parts.handWave.rotation.z.toFixed(2):'none'} hy=${parts.handWave?parts.handWave.position.y.toFixed(2):'-'} wt=${waveT.toFixed(2)} wa=${WAVEAT} mr=${parts.mouth.rotation.z.toFixed(3)} ms=${parts.mouth.scale.x.toFixed(2)},${parts.mouth.scale.y.toFixed(2)} mp=${parts.mouth.position.x.toFixed(3)},${parts.mouth.position.y.toFixed(3)},${parts.mouth.position.z.toFixed(3)}`;

    // 眨眼
    if (FREEZE) {
      if (FORCE_BLINK) setEyeOpen(0.06);
    } else {
      const sleepingNow = (MODE === 'sleep' || MODE === 'night') && wakeT < 0;
      if (yawnT >= 0) {
        setEyeOpen(0.42 + 0.18 * Math.sin(yawnT * 6));
      } else if (sleepingNow) {
        setEyeOpen(0.07);
      } else if (wakeT >= 0) {
        wakeT += dt;
        const k = Math.min(wakeT / 0.45, 1);
        setEyeOpen(1 + 0.18 * Math.sin(k * Math.PI));
        if (wakeT > 0.6) { wakeT = -1; setEyeOpen(1); }
      } else {
      nextBlink -= dt;
      if (nextBlink <= 0 && blinkT < 0) { blinkT = 0; nextBlink = 2.8 + Math.random()*3.4; }
      if (blinkT >= 0) {
        blinkT += dt;
        const d = 0.13;
        const k = blinkT < d/2 ? blinkT/(d/2) : Math.max(0, 1 - (blinkT - d/2)/(d/2));
        setEyeOpen(1 - 0.94 * easeInOut(k));
        if (blinkT > d) { blinkT = -1; setEyeOpen(1); }
      }
      }
    }

    // 4 秒沒互動 → 表情自動回到笑臉
    if (!FREEZE && MODE === 'idle' && expr !== 'smile' && performance.now() - lastTap > 4000) { expr = 'smile'; applyExpression(); }

    // 腮紅：點擊閃一下，再慢慢退
    if (SHOW_BLUSH) blushAmt = 0.85;
    blushAmt += (blushTarget - blushAmt) * Math.min(1, dt*1.6);
    blush.forEach(b => { b.material.opacity = Math.max(0, blushAmt) * 0.85; });
  }

  renderer.render(scene, camera);
}

/* ── 睡覺 / 晚上 / 超支 ── */
let sky = null, cap = null, NIGHT = false;
const BG_DAY = '';
const BG_NIGHT = 'linear-gradient(180deg,#2a2350 0%,#3b2f66 45%,#5a4180 75%,#7a5390 100%)';
const BG_OVER  = 'linear-gradient(180deg,#dfe3ee 0%,#e8dbe4 60%,#efd6dc 100%)';

function buildSky() {
  if (sky) return;
  sky = new THREE.Group();
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(64, 64, 8, 64, 64, 62);
  g.addColorStop(0, 'rgba(255,252,224,1)');
  g.addColorStop(0.55, 'rgba(255,240,185,0.95)');
  g.addColorStop(1, 'rgba(255,235,160,0)');
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const moon = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  moon.position.set(-2.05, 1.55, -3.2);
  sky.add(moon);
  for (let i = 0; i < 26; i++) {
    const r = 0.035 + Math.random() * 0.055;
    const st = new THREE.Mesh(new THREE.CircleGeometry(r, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff6cf, transparent: true, opacity: 0.85, depthWrite: false, toneMapped: false }));
    st.position.set((Math.random() - 0.5) * 7.5, (Math.random() - 0.15) * 4.4, -3 - Math.random() * 0.8);
    st.userData.tw = Math.random() * 6.28;
    sky.add(st);
  }
  sky.visible = false;
  scene.add(sky);
}

function buildCap() {
  if (cap || !parts.head) return;
  const bb = new THREE.Box3().setFromObject(parts.head);
  const topWorld = new THREE.Vector3((bb.min.x + bb.max.x) / 2, bb.max.y, (bb.min.z + bb.max.z) / 2);
  const local = window.__body.worldToLocal(topWorld.clone());
  const pink  = new THREE.MeshStandardMaterial({ color: 0xff9ecb, roughness: 0.8, flatShading: true, emissive: 0x442233, emissiveIntensity: 0.06 });
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true });
  cap = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.46, 0.66, 12, 1), pink);
  cone.position.y = 0.30;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.12, 12, 1, true), pink);
  band.position.y = 0.02;
  const pom = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), white);
  pom.position.y = 0.66;
  cap.add(cone, band, pom);
  cap.position.set(local.x, local.y + 0.02, local.z);
  cap.rotation.z = 0.14;
  cap.scale.setScalar(1 / (baseScale || 1));
  cap.visible = false;
  window.__body.add(cap);
}

function enterSleep() {
  MODE = (NIGHT ? 'night' : 'sleep');
  wakeT = -1;
  expr = 'smile'; applyExpression(true);
  if (window.__headRotate) window.__headRotate(-0.05);
}
function enterWake() {
  MODE = 'idle';
  wakeT = 0; idleT = 0; yawnT = -1;
  if (window.__headRotate) window.__headRotate(0);
  expr = 'smile'; applyExpression(true);
}
function setMode(m) {
  buildSky(); buildCap();
  if (m === 'night') {
    NIGHT = true;
    document.body.style.background = BG_NIGHT;
    if (sky) sky.visible = true;
    if (cap) cap.visible = true;
    enterSleep();
  } else if (m === 'sleep') {
    NIGHT = false;
    document.body.style.background = BG_DAY;
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    enterSleep();
  } else if (m === 'overspend') {
    MODE = 'overspend';
    NIGHT = false;
    document.body.style.background = BG_OVER;
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    idleT = 0; wakeT = 0; setEyeOpen(1);
    if (window.__headRotate) window.__headRotate(-0.07);
    expr = 'sad'; applyExpression(true);
  } else {   // idle / wake
    MODE = 'idle'; NIGHT = false;
    document.body.style.background = BG_DAY;
    if (sky) sky.visible = false;
    if (cap) cap.visible = false;
    enterWake();
  }
}
window.__setMode = setMode;

/* ── 展示台按鈕 ── */
(function buildBar() {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:9px 9px 12px;overflow:visible;z-index:99;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,.06)';
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = 'flex:0 0 auto;padding:7px 11px;border-radius:11px;border:none;background:#ffd9ea;color:#8a3a63;font-size:13px;font-weight:700;font-family:inherit;box-shadow:0 2px 0 rgba(180,90,130,.25)';
    b.onclick = ev => { ev.stopPropagation(); fn(); };
    bar.appendChild(b);
  };
  mk('待機', () => setMode('idle'));
  mk('睡覺', () => setMode('sleep'));
  mk('起床', () => setMode('idle'));
  mk('晚上', () => setMode('night'));
  mk('超支', () => setMode('overspend'));
  mk('晃耳朵', () => { hairSwingT = 0; });
  mk('揮手', () => { waveT = 0; expr = 'smile'; applyExpression(true); });
  mk('跳', () => { if (jumpPhase === 'idle' && jumpY <= 0.001) { jumpPhase = 'crouch'; crouchT = 0; } });
  document.body.appendChild(bar);
  // 把原本的說明文字往上移
  const hint = document.querySelector('.hint, #hint');
  if (hint) hint.style.bottom = '108px';
})();

renderer.setAnimationLoop(tick);
</script>
